<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>泡泡学园 - 宝宝的神奇花园</title>
    <style>
        :root {
            --sky-top: #b8e4f0;
            --sky-bottom: #fce4ec;
            --grass: #a8d8a0;
            --grass-dark: #7cb878;
            --bubble-glow: rgba(255, 255, 255, 0.7);
            --star-gold: #ffc107;
            --text-dark: #5d4037;
            --card-bg: rgba(255, 255, 255, 0.85);
            --pink-soft: #ffcdd2;
            --blue-soft: #bbdefb;
            --green-soft: #c8e6c9;
            --yellow-soft: #fff9c4;
            --purple-soft: #e1bee7;
            --orange-soft: #ffe0b2;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #c9e8f5 0%, #e8d5f5 25%, #fce4ec 55%, #d4ecc8 78%, #b8dba0 100%);
            background-attachment: fixed;
            touch-action: manipulation;
            position: relative;
            cursor: default;
        }

        /* 天空装饰 - 柔和云朵 */
        .sky-clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 0;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: cloudFloat linear infinite;
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 {
            width: 90px;
            height: 50px;
            top: 8%;
            left: 10%;
            animation-duration: 35s;
            border-radius: 50px;
        }
        .cloud1::before {
            width: 55px;
            height: 55px;
            top: -28px;
            left: 15px;
        }
        .cloud1::after {
            width: 40px;
            height: 40px;
            top: -15px;
            left: 45px;
        }
        .cloud2 {
            width: 70px;
            height: 38px;
            top: 15%;
            left: 55%;
            animation-duration: 42s;
            animation-delay: -10s;
            border-radius: 50px;
        }
        .cloud2::before {
            width: 42px;
            height: 42px;
            top: -22px;
            left: 10px;
        }
        .cloud2::after {
            width: 32px;
            height: 32px;
            top: -10px;
            left: 35px;
        }
        .cloud3 {
            width: 80px;
            height: 44px;
            top: 22%;
            left: 30%;
            animation-duration: 38s;
            animation-delay: -20s;
            border-radius: 50px;
        }
        .cloud3::before {
            width: 48px;
            height: 48px;
            top: -26px;
            left: 12px;
        }
        .cloud3::after {
            width: 36px;
            height: 36px;
            top: -12px;
            left: 40px;
        }

        @keyframes cloudFloat {
            0% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(30px);
            }
            50% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(20px);
            }
            100% {
                transform: translateX(0);
            }
        }

        /* 草地装饰 */
        .ground-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18%;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(168, 216, 160, 0.35) 30%, rgba(124, 184, 120, 0.55) 70%, rgba(100, 160, 95, 0.7) 100%);
            border-radius: 60% 70% 0 0 / 40% 40% 0 0;
        }
        .grass-blade {
            position: absolute;
            bottom: 0;
            width: 8px;
            background: #8cc97a;
            border-radius: 50% 50% 0 0;
            animation: swayGrass 3s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes swayGrass {
            0%,
            100% {
                transform: rotate(-3deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        /* 小花 */
        .decor-flower {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            font-size: 28px;
            animation: flowerBob 4s ease-in-out infinite;
        }
        @keyframes flowerBob {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            30% {
                transform: translateY(-8px) rotate(3deg);
            }
            60% {
                transform: translateY(-3px) rotate(-2deg);
            }
        }

        /* 主游戏容器 */
        .game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            pointer-events: none;
        }

        /* 顶部状态栏 */
        .top-bar {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            margin-top: max(12px, env(safe-area-inset-top, 12px));
            background: var(--card-bg);
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            transition: all 0.3s ease;
        }
        .star-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 700;
            color: #f59e0b;
            letter-spacing: 1px;
        }
        .star-icon {
            font-size: 30px;
            animation: starPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(245, 158, 11, 0.5));
        }
        @keyframes starPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }
        .star-count {
            font-size: 28px;
            min-width: 40px;
            text-align: center;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        .level-indicator {
            font-size: 14px;
            color: #888;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 15px;
            letter-spacing: 0.5px;
        }
        .sound-btn {
            pointer-events: auto;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .sound-btn:active {
            transform: scale(0.9);
            background: #e0e0e0;
        }
        .sound-btn.muted {
            background: #ffebee;
            opacity: 0.7;
        }

        /* 泡泡游戏区域 */
        .bubble-area {
            pointer-events: auto;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 20;
            min-height: 55vh;
            overflow: visible;
        }

        /* 泡泡样式 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            animation: bubbleFloat var(--float-duration, 4s) ease-in-out infinite;
            animation-delay: var(--float-delay, 0s);
            z-index: 20;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 -4px 12px rgba(255, 255, 255, 0.5),
                inset 0 4px 12px rgba(255, 255, 255, 0.8);
            background: radial-gradient(circle at 35% 30%,
                    rgba(255, 255, 255, 0.85) 0%,
                    rgba(255, 255, 255, 0.5) 25%,
                    var(--bubble-color, rgba(200, 220, 255, 0.45)) 55%,
                    rgba(180, 200, 240, 0.35) 100%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }
        .bubble::after {
            content: '';
            position: absolute;
            width: 28%;
            height: 18%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            top: 16%;
            left: 20%;
            transform: rotate(-20deg);
            pointer-events: none;
        }
        .bubble:active {
            transform: scale(0.9);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12),
                inset 0 -2px 8px rgba(255, 255, 255, 0.4),
                inset 0 2px 8px rgba(255, 255, 255, 0.7);
        }
        .bubble.popping {
            animation: popBubble 0.5s ease-out forwards !important;
            pointer-events: none;
        }
        @keyframes popBubble {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            30% {
                transform: scale(1.5);
                opacity: 0.7;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }
        @keyframes bubbleFloat {
            0%,
            100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-18px) translateX(8px);
            }
            50% {
                transform: translateY(-6px) translateX(-4px);
            }
            75% {
                transform: translateY(-22px) translateX(6px);
            }
        }
        .bubble .bubble-emoji {
            font-size: var(--emoji-size, 38px);
            pointer-events: none;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.08));
            transition: transform 0.2s;
        }
        .bubble .bubble-number {
            font-size: var(--emoji-size, 36px);
            font-weight: 900;
            pointer-events: none;
            position: relative;
            z-index: 2;
            color: #5d4037;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }
        .bubble .bubble-shape {
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        /* 金色泡泡 */
        .bubble.golden {
            background: radial-gradient(circle at 35% 30%,
                    rgba(255, 255, 220, 0.9) 0%,
                    rgba(255, 240, 180, 0.6) 25%,
                    rgba(255, 210, 100, 0.5) 55%,
                    rgba(255, 180, 60, 0.4) 100%);
            border: 3px solid rgba(255, 200, 60, 0.8);
            box-shadow: 0 8px 36px rgba(255, 170, 30, 0.35),
                inset 0 -4px 12px rgba(255, 255, 200, 0.6),
                inset 0 4px 12px rgba(255, 255, 200, 0.9),
                0 0 40px rgba(255, 180, 40, 0.4);
            animation: bubbleFloat var(--float-duration, 3.5s) ease-in-out infinite,
                goldenGlow 1.5s ease-in-out infinite !important;
            animation-delay: var(--float-delay, 0s), 0s;
        }
        @keyframes goldenGlow {
            0%,
            100% {
                box-shadow: 0 8px 36px rgba(255, 170, 30, 0.35),
                    inset 0 -4px 12px rgba(255, 255, 200, 0.6),
                    inset 0 4px 12px rgba(255, 255, 200, 0.9),
                    0 0 40px rgba(255, 180, 40, 0.4);
            }
            50% {
                box-shadow: 0 8px 44px rgba(255, 170, 30, 0.55),
                    inset 0 -4px 12px rgba(255, 255, 200, 0.7),
                    inset 0 4px 12px rgba(255, 255, 200, 0.95),
                    0 0 60px rgba(255, 180, 40, 0.7);
            }
        }

        /* 粒子效果 */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            border-radius: 50%;
            animation: particleFly 0.8s ease-out forwards;
        }
        @keyframes particleFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--px), var(--py)) scale(0);
                opacity: 0;
            }
        }

        /* 飞星 */
        .flying-star {
            position: fixed;
            pointer-events: none;
            z-index: 250;
            font-size: 28px;
            animation: flyToTarget 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes flyToTarget {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            60% {
                transform: translate(calc(var(--tx) * 0.7), calc(var(--ty) * 0.7)) scale(1.4);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.5);
                opacity: 0.7;
            }
        }

        /* 庆祝覆盖层 */
        .celebrate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .celebrate-text {
            font-size: 60px;
            font-weight: 900;
            animation: celebBounce 0.6s ease-out forwards;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }
        @keyframes celebBounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.4);
                opacity: 1;
            }
            70% {
                transform: scale(0.85);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 290;
            font-size: 24px;
            animation: confettiFall 2.5s ease-in forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-60px) rotate(0deg) scale(1);
                opacity: 1;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* 底部模式切换栏 */
        .mode-bar {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            margin-bottom: max(10px, var(--safe-bottom));
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            transition: all 0.3s;
        }
        .mode-btn {
            padding: 9px 15px;
            border-radius: 22px;
            border: 2px solid transparent;
            background: #f5f5f5;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            color: #777;
            transition: all 0.25s;
            white-space: nowrap;
            letter-spacing: 0.5px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .mode-btn:active {
            transform: scale(0.93);
        }
        .mode-btn.active {
            background: #fff;
            border-color: #ff9800;
            color: #e65100;
            box-shadow: 0 3px 12px rgba(255, 152, 0, 0.2);
            font-weight: 700;
        }
        .mode-btn .mode-emoji {
            font-size: 18px;
            margin-right: 2px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .bubble {
                width: 75px !important;
                height: 75px !important;
            }
            .bubble .bubble-emoji {
                font-size: 30px !important;
            }
            .bubble .bubble-number {
                font-size: 28px !important;
            }
            .mode-btn {
                padding: 7px 10px;
                font-size: 12px;
                border-radius: 18px;
            }
            .mode-btn .mode-emoji {
                font-size: 15px;
            }
            .top-bar {
                padding: 10px 14px;
                gap: 8px;
                border-radius: 30px;
            }
            .star-icon {
                font-size: 24px;
            }
            .star-count {
                font-size: 22px;
            }
            .mode-bar {
                gap: 4px;
                padding: 8px 10px;
                border-radius: 24px;
            }
        }
        @media (min-width: 768px) {
            .bubble {
                width: 110px !important;
                height: 110px !important;
            }
            .bubble .bubble-emoji {
                font-size: 46px !important;
            }
            .bubble .bubble-number {
                font-size: 44px !important;
            }
            .mode-btn {
                padding: 10px 18px;
                font-size: 16px;
            }
        }
        @media (min-width: 1024px) {
            .bubble {
                width: 120px !important;
                height: 120px !important;
            }
            .bubble .bubble-emoji {
                font-size: 50px !important;
            }
            .bubble .bubble-number {
                font-size: 48px !important;
            }
        }
    </style>
</head>
<body>

    <!-- 天空云朵装饰 -->
    <div class="sky-clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <!-- 草地装饰 -->
    <div class="ground-decoration"></div>

    <!-- 装饰小花 -->
    <div class="decor-flower" style="bottom:14%;left:8%;animation-delay:0s;">🌼</div>
    <div class="decor-flower" style="bottom:12%;left:22%;animation-delay:1.2s;font-size:22px;">🌸</div>
    <div class="decor-flower" style="bottom:15%;right:12%;animation-delay:2.5s;">🌻</div>
    <div class="decor-flower" style="bottom:11%;right:25%;animation-delay:0.8s;font-size:24px;">🌷</div>
    <div class="decor-flower" style="bottom:16%;left:40%;animation-delay:3s;font-size:20px;">💐</div>
    <div class="decor-flower" style="bottom:13%;right:38%;animation-delay:1.8s;font-size:26px;">🌺</div>

    <!-- 主容器 -->
    <div class="game-container" id="gameContainer">
        <!-- 顶部状态栏 -->
        <div class="top-bar" id="topBar">
            <span class="star-icon">⭐</span>
            <div class="star-display">
                <span class="star-count" id="starCount">0</span>
            </div>
            <span class="level-indicator" id="levelIndicator">🌱 开始探索</span>
            <button class="sound-btn" id="soundBtn" aria-label="声音开关">🔊</button>
        </div>

        <!-- 泡泡区域 -->
        <div class="bubble-area" id="bubbleArea"></div>

        <!-- 模式切换栏 -->
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="mixed">
                <span class="mode-emoji">🎪</span> 混合
            </button>
            <button class="mode-btn" data-mode="animals">
                <span class="mode-emoji">🐶</span> 动物
            </button>
            <button class="mode-btn" data-mode="fruits">
                <span class="mode-emoji">🍎</span> 水果
            </button>
            <button class="mode-btn" data-mode="numbers">
                <span class="mode-emoji">🔢</span> 数字
            </button>
            <button class="mode-btn" data-mode="colors">
                <span class="mode-emoji">🌈</span> 颜色
            </button>
            <button class="mode-btn" data-mode="shapes">
                <span class="mode-emoji">⭐</span> 形状
            </button>
        </div>
    </div>

    <!-- 庆祝层 -->
    <div class="celebrate-overlay" id="celebrateOverlay"></div>

    <script>
        (function() {
            // ============ 游戏核心 ============
            const bubbleArea = document.getElementById('bubbleArea');
            const starCountEl = document.getElementById('starCount');
            const levelIndicator = document.getElementById('levelIndicator');
            const celebrateOverlay = document.getElementById('celebrateOverlay');
            const soundBtn = document.getElementById('soundBtn');
            const modeBar = document.getElementById('modeBar');
            const topBar = document.getElementById('topBar');

            let totalStars = 0;
            let currentMode = 'mixed'; // mixed, animals, fruits, numbers, colors, shapes
            let soundEnabled = true;
            let bubbles = [];
            let maxBubbles = 5;
            let isProcessing = false;
            let audioCtx = null;
            let speechQueue = [];
            let isSpeaking = false;

            // 根据屏幕大小调整泡泡数量和大小
            function adjustForScreen() {
                const w = window.innerWidth;
                if (w < 400) {
                    maxBubbles = 4;
                } else if (w < 600) {
                    maxBubbles = 5;
                } else if (w < 900) {
                    maxBubbles = 6;
                } else {
                    maxBubbles = 7;
                }
            }
            adjustForScreen();
            window.addEventListener('resize', () => {
                adjustForScreen();
                repositionAllBubbles();
            });
            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    adjustForScreen();
                    repositionAllBubbles();
                }, 400);
            });

            // ============ 数据定义 ============
            const dataAnimals = [
                { emoji: '🐶', cn: '小狗', en: 'dog', sound: '汪汪汪' },
                { emoji: '🐱', cn: '小猫', en: 'cat', sound: '喵喵喵' },
                { emoji: '🐰', cn: '兔子', en: 'rabbit', sound: '蹦蹦跳' },
                { emoji: '🐮', cn: '奶牛', en: 'cow', sound: '哞哞哞' },
                { emoji: '🐔', cn: '小鸡', en: 'chicken', sound: '叽叽叽' },
                { emoji: '🐷', cn: '小猪', en: 'pig', sound: '哼哼哼' },
                { emoji: '🐘', cn: '大象', en: 'elephant', sound: '长鼻子大象' },
                { emoji: '🦆', cn: '鸭子', en: 'duck', sound: '嘎嘎嘎' },
                { emoji: '🐑', cn: '小羊', en: 'sheep', sound: '咩咩咩' },
                { emoji: '🐴', cn: '小马', en: 'horse', sound: '哒哒哒' },

            // ============ 音频系统 ============
            function getAudioContext() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        audioCtx = null;
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            function playTone(freq, duration, type = 'sine', vol = 0.08) {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioContext();
                    if (!ctx) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) { /* 静默处理 */ }
            }

            function playPopSound() {
                playTone(600, 0.15, 'sine', 0.06);
                setTimeout(() => playTone(900, 0.1, 'sine', 0.04), 60);
                setTimeout(() => playTone(1200, 0.08, 'sine', 0.03), 110);
            }

            function playStarSound() {
                playTone(800, 0.12, 'triangle', 0.07);
                setTimeout(() => playTone(1100, 0.1, 'triangle', 0.06), 70);
                setTimeout(() => playTone(1400, 0.15, 'triangle', 0.05), 130);
            }

            function playCelebrateSound() {
                const notes = [523, 659, 784, 1047, 784, 1047, 1319];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 0.2, 'triangle', 0.08), i * 100);
                });
            }

            function playGoldenSound() {
                const notes = [600, 800, 1000, 1200, 1600];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 0.18, 'sine', 0.07), i * 70);
                });
            }

            // ============ 语音播报 ============
            function speak(text, rate = 0.85) {
                if (!soundEnabled) return;
                speechQueue.push({ text, rate });
                if (!isSpeaking) processSpeechQueue();
            }

            function processSpeechQueue() {
                if (speechQueue.length === 0) {
                    isSpeaking = false;
                    return;
                }
                isSpeaking = true;
                const { text, rate } = speechQueue.shift();
                if (!('speechSynthesis' in window)) {
                    isSpeaking = false;
                    processSpeechQueue();
                    return;
                }
                // 取消之前的语音
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = rate;
                utterance.pitch = 1.15;
                utterance.volume = 0.9;

                // 尝试选择中文语音
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh-TW') || v.lang
                    .includes('zh-HK'));
                if (zhVoice) {
                    utterance.voice = zhVoice;
                }

                utterance.onend = () => {
                    setTimeout(() => {
                        isSpeaking = false;
                        processSpeechQueue();
                    }, 150);
                };
                utterance.onerror = () => {
                    isSpeaking = false;
                    processSpeechQueue();
                };

                // 超时保护
                const timeout = setTimeout(() => {
                    window.speechSynthesis.cancel();
                    isSpeaking = false;
                    processSpeechQueue();
                }, 4000);

                utterance.onend = () => {
                    clearTimeout(timeout);
                    setTimeout(() => {
                        isSpeaking = false;
                        processSpeechQueue();
                    }, 150);
                };
                utterance.onerror = () => {
                    clearTimeout(timeout);
                    isSpeaking = false;
                    processSpeechQueue();
                };

                window.speechSynthesis.speak(utterance);
            }

            // 预加载语音列表
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }

            function speakItemData(itemData) {
                if (!soundEnabled) return;
                // 清除语音队列
                speechQueue = [];
                window.speechSynthesis?.cancel();
                isSpeaking = false;

                let textToSpeak = '';
                if (itemData.category === 'number' || itemData.number !== undefined) {
                    textToSpeak = `${itemData.cn}！`;
                    if (itemData.en) {
                        textToSpeak += ` ${itemData.en}`;
                    }
                } else if (itemData.category === 'color' || itemData.colorHex) {
                    textToSpeak = `${itemData.cn}！${itemData.en}`;
                } else if (itemData.category === 'shape' || itemData.shapeType) {
                    textToSpeak = `${itemData.cn}！${itemData.en}`;
                } else if (itemData.sound) {
                    textToSpeak = `${itemData.cn}！${itemData.sound}！${itemData.en}`;
                } else {
                    textToSpeak = `${itemData.cn}！${itemData.en}`;
                }
                speak(textToSpeak, 0.8);
            }

            // ============ 粒子效果 ============
            function spawnParticles(x, y, count = 18, colors = null) {
                const defaultColors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff922b',
                    '#e040fb', '#00bcd4', '#ff6090', '#69f0ae', '#ffab40'
                ];
                const useColors = colors || defaultColors;
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const size = Math.random() * 14 + 5;
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 100 + 40;
                    const px = Math.cos(angle) * distance;
                    const py = Math.sin(angle) * distance - Math.random() * 50;
                    particle.style.cssText = `
                        left: ${x}px;
                        top: ${y}px;
                        width: ${size}px;
                        height: ${size}px;
                        background: ${useColors[Math.floor(Math.random() * useColors.length)]};
                        --px: ${px}px;
                        --py: ${py}px;
                        animation-duration: ${Math.random() * 0.5 + 0.5}s;
                    `;
                    fragment.appendChild(particle);
                }
                document.body.appendChild(fragment);
                setTimeout(() => {
                    document.querySelectorAll('.particle').forEach(p => {
                        if (parseFloat(p.style.animationDuration) < 1.2) p.remove();
                    });
                }, 1000);
            }

            function spawnFlyingStar(fromX, fromY, toElement) {
                const toRect = toElement.getBoundingClientRect();
                const toX = toRect.left + toRect.width / 2;
                const toY = toRect.top + toRect.height / 2;
                const tx = toX - fromX;
                const ty = toY - fromY;

                star.className = 'flying-star';
                star.textContent = '⭐';
                star.style.cssText = `
                    left: ${fromX}px;
                    top: ${fromY}px;
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                `;
                document.body.appendChild(star);
                playStarSound();
                setTimeout(() => star.remove(), 750);
            }

            // ============ 泡泡管理 ============
            function getBubbleSize() {
                const w = window.innerWidth;
                if (w < 400) return 75;
                if (w < 600) return 85;
                if (w < 900) return 100;
                return 115;
            }

            function getRandomPosition(bubbleSize) {
                const areaRect = bubbleArea.getBoundingClientRect();
                const margin = bubbleSize + 10;
                const maxX = areaRect.width - margin;
                const maxY = areaRect.height - margin;
                const x = Math.random() * maxX + margin / 2;
                const y = Math.random() * maxY + margin / 2;
                return { x, y };
            }

            function isTooClose(newX, newY, existingBubbles, minDist) {
                for (const b of existingBubbles) {
                    const bx = parseFloat(b.el.style.left);
                    const by = parseFloat(b.el.style.top);
                    const dist = Math.sqrt((newX - bx) ** 2 + (newY - by) ** 2);
                    if (dist < minDist) return true;
                }
                return false;
            }

            function createBubbleElement(itemData, isGolden = false) {
                const size = getBubbleSize();
                const el = document.createElement('div');
                el.className = 'bubble' + (isGolden ? ' golden' : '');
                const floatDuration = (Math.random() * 2.5 + 3) + 's';
                const floatDelay = (Math.random() * 3) + 's';
                el.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    --float-duration: ${floatDuration};
                    --float-delay: ${floatDelay};
                    --emoji-size: ${size * 0.42}px;
                `;

                // 随机柔和颜色
                const softColors = [
                    'rgba(255,182,193,0.4)', 'rgba(173,216,230,0.4)', 'rgba(152,251,152,0.4)',
                    'rgba(255,255,180,0.4)', 'rgba(221,160,221,0.4)', 'rgba(255,218,185,0.4)',
                    'rgba(200,230,255,0.4)', 'rgba(255,228,225,0.4)', 'rgba(230,255,230,0.4)',
                ];
                const chosenColor = softColors[Math.floor(Math.random() * softColors.length)];
                el.style.setProperty('--bubble-color', chosenColor);

                // 内容
                if (itemData.category === 'shape' || itemData.shapeType) {
                    const shapeDiv = document.createElement('div');
                    shapeDiv.className = 'bubble-shape';
                    shapeDiv.style.cssText = getShapeCSS(itemData.shapeType, size * 0.35);
                    el.appendChild(shapeDiv);
                } else if (itemData.category === 'number' || itemData.number !== undefined) {
                    const numSpan = document.createElement('span');
                    numSpan.className = 'bubble-number';
                    numSpan.textContent = itemData.number;
                    el.appendChild(numSpan);
                    // 小装饰emoji
                    if (itemData.displayEmoji && itemData.count <= 5) {
                        const miniEmoji = document.createElement('span');
                        miniEmoji.style.cssText =
                            'position:absolute;bottom:18%;font-size:14px;pointer-events:none;z-index:2;';
                        miniEmoji.textContent = itemData.displayEmoji.repeat(Math.min(itemData.count, 5));
                        el.appendChild(miniEmoji);
                    }
                } else if (itemData.category === 'color' || itemData.colorHex) {
                    const colorDot = document.createElement('div');
                    colorDot.style.cssText = `
                        width: ${size * 0.45}px;
                        height: ${size * 0.45}px;
                        border-radius: 50%;
                        background: ${itemData.colorHex || itemData.emoji};
                        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                        pointer-events: none;
                        z-index: 2;
                        position: relative;
                    `;
                    el.appendChild(colorDot);
                } else {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'bubble-emoji';
                    emojiSpan.textContent = itemData.emoji || '❓';
                    el.appendChild(emojiSpan);
                }

                // 点击事件
                el.addEventListener('click', (e) => {
                    if (isProcessing) return;
                    if (el.classList.contains('popping')) return;
                    handleBubbleClick(el, itemData, isGolden, e);
                });
                el.addEventListener('touchend', (e) => {
                    if (isProcessing) return;
                    if (el.classList.contains('popping')) return;
                    e.preventDefault();
                    handleBubbleClick(el, itemData, isGolden, e);
                });

                return el;
            }

            function getShapeCSS(shapeType, size) {
                const s = size + 'px';
                switch (shapeType) {
                    case 'circle':
                        return `width:${s};height:${s};border-radius:50%;background:#ff8a80;box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'square':
                        return `width:${s};height:${s};border-radius:6px;background:#82b1ff;box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'triangle':
                        return `width:0;height:0;border-left:${size*0.5}px solid transparent;border-right:${size*0.5}px solid transparent;border-bottom:${size}px solid #69f0ae;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));`;
                    case 'star':
                        return `width:${s};height:${s};background:#ffd740;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'heart':
                        return `width:${s};height:${s};background:#ff4081;clip-path:path('M50,30 C50,10 10,10 10,35 C10,60 50,85 50,85 C50,85 90,60 90,35 C90,10 50,10 50,30Z');box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'diamond':
                        return `width:${s};height:${s};background:#b388ff;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    default:
                        return `width:${s};height:${s};border-radius:50%;background:#ccc;`;
                }
            }

            function handleBubbleClick(el, itemData, isGolden, event) {
                isProcessing = true;
                const rect = el.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // 弹出动画
                el.classList.add('popping');
                playPopSound();
                if (isGolden) {
                    playGoldenSound();
                }

                // 粒子效果
                const goldenColors = ['#ffd700', '#ffec8b', '#ffeaa7', '#fff176', '#ffcc00', '#ffab00'];
                spawnParticles(centerX, centerY, isGolden ? 30 : 18, isGolden ? goldenColors : null);

                // 飞星
                const starTarget = document.getElementById('topBar');
                spawnFlyingStar(centerX, centerY, starTarget);

                // 更新星星
                const starsEarned = isGolden ? 3 : 1;
                totalStars += starsEarned;
                updateStarDisplay();

                // 语音播报
                speakItemData(itemData);

                // 检查里程碑
                if (totalStars % 10 === 0 && totalStars > 0) {
                    setTimeout(() => celebrateMilestone(), 400);
                }

                // 移除泡泡并生成新泡泡
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                    const idx = bubbles.findIndex(b => b.el === el);
                    if (idx >= 0) bubbles.splice(idx, 1);
                    refillBubbles();
                    isProcessing = false;
                }, 450);

                // 如果是金色泡泡，额外生成一个普通泡泡
                if (isGolden) {
                    setTimeout(() => refillBubbles(), 300);
                }
            }

            function updateStarDisplay() {
                starCountEl.textContent = totalStars;
                if (totalStars >= 100) {
                    levelIndicator.textContent = '🏆 超级学霸';
                } else if (totalStars >= 50) {
                    levelIndicator.textContent = '🌟 智慧之星';
                } else if (totalStars >= 30) {
                    levelIndicator.textContent = '🎈 学习达人';
                } else if (totalStars >= 15) {
                    levelIndicator.textContent = '🌻 小小探索家';
                } else if (totalStars >= 5) {
                    levelIndicator.textContent = '🌱 初学宝宝';
                } else {
                    levelIndicator.textContent = '🌱 开始探索';
                }
                // 顶部栏微动画
                topBar.style.transform = 'scale(1.04)';
                setTimeout(() => { topBar.style.transform = 'scale(1)'; }, 200);
            }

            function refillBubbles() {
                const currentCount = bubbles.filter(b => !b.el.classList.contains('popping')).length;
                const needed = maxBubbles - currentCount;
                for (let i = 0; i < needed; i++) {
                    spawnOneBubble();
                }
            }

            function spawnOneBubble() {
                const dataPool = getDataForMode(currentMode);
                if (dataPool.length === 0) return;
                const itemData = dataPool[Math.floor(Math.random() * dataPool.length)];
                // 金色泡泡概率12%
                const isGolden = Math.random() < 0.12;
                const el = createBubbleElement(itemData, isGolden);
                const size = getBubbleSize();
                let pos;
                let attempts = 0;
                const activeBubbles = bubbles.filter(b => !b.el.classList.contains('popping'));
                do {
                    pos = getRandomPosition(size);
                    attempts++;
                } while (isTooClose(pos.x, pos.y, activeBubbles, size * 1.5) && attempts < 30);

                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                bubbleArea.appendChild(el);
                bubbles.push({ el, itemData, isGolden });
            }

            function repositionAllBubbles() {
                const size = getBubbleSize();
                const activeBubbles = bubbles.filter(b => !b.el.classList.contains('popping'));
                // 重新分配位置
                const tempList = [];
                for (const b of activeBubbles) {
                    let pos;
                    let attempts = 0;
                    do {
                        pos = getRandomPosition(size);
                        attempts++;
                    } while (isTooClose(pos.x, pos.y, tempList, size * 1.4) && attempts < 30);
                    b.el.style.left = pos.x + 'px';
                    b.el.style.top = pos.y + 'px';
                    b.el.style.width = size + 'px';
                    b.el.style.height = size + 'px';
                    b.el.style.setProperty('--emoji-size', size * 0.42 + 'px');
                    tempList.push({ el: b.el, x: pos.x, y: pos.y });
                }
            }

            function clearAllBubbles() {
                for (const b of bubbles) {
                    if (b.el.parentNode) b.el.remove();
                }
                bubbles = [];
                speechQueue = [];
                window.speechSynthesis?.cancel();
                isSpeaking = false;
                isProcessing = false;
            }

            function initBubbles() {
                clearAllBubbles();
                for (let i = 0; i < maxBubbles; i++) {
                    spawnOneBubble();
                }
            }

            // ============ 模式切换 ============
            modeBar.addEventListener('click', (e) => {
                const btn = e.target.closest('.mode-btn');
                if (!btn) return;
                const mode = btn.dataset.mode;
                if (mode === currentMode) return;
                currentMode = mode;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                clearAllBubbles();
                initBubbles();
                // 模式切换提示
                const modeNames = {
                    mixed: '混合模式！探索各种知识',
                    animals: '动物朋友！来认识小动物吧',
                    fruits: '水果乐园！看看有哪些水果',
                    numbers: '数字天地！一起来数数',
                    colors: '彩虹颜色！认识美丽的颜色',
                    shapes: '形状王国！发现有趣的形状',
                };
                if (soundEnabled) {
                    speak(modeNames[mode] || '切换模式', 0.9);
                }
            });

            // ============ 声音开关 ============
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                if (soundEnabled) {
                    soundBtn.textContent = '🔊';
                    soundBtn.classList.remove('muted');
                    playTone(500, 0.1, 'sine', 0.04);
                } else {
                    soundBtn.textContent = '🔇';
                    soundBtn.classList.add('muted');
                    speechQueue = [];
                    window.speechSynthesis?.cancel();
                    isSpeaking = false;
                }
            });

            // ============ 初始化 ============
            function init() {
                getAudioContext(); // 预初始化音频上下文
                initBubbles();
                updateStarDisplay();

                // 欢迎语音（延迟一下）
                setTimeout(() => {
                    if (soundEnabled) {
                        speak('欢迎来到泡泡学园！点击泡泡开始学习吧！', 0.85);
                    }
                }, 800);

                // 定期检查泡泡数量
                setInterval(() => {
                    const activeCount = bubbles.filter(b => !b.el.classList.contains('popping') && b.el
                        .parentNode).length;
                    if (activeCount < maxBubbles && !isProcessing) {
                        refillBubbles();
                    }
                }, 2000);

                // 偶尔自动高亮一个泡泡引导点击（10秒无操作后）
                let lastInteraction = Date.now();
                document.addEventListener('click', () => { lastInteraction = Date.now(); });
                document.addEventListener('touchend', () => { lastInteraction = Date.now(); });
                setInterval(() => {
                    const inactiveTime = Date.now() - lastInteraction;
                    if (inactiveTime > 10000 && bubbles.length > 0 && !isProcessing) {
                        const activeBubbles = bubbles.filter(b => !b.el.classList.contains('popping') && b.el
                            .parentNode);
                        if (activeBubbles.length > 0) {
                            const randomBubble = activeBubbles[Math.floor(Math.random() * activeBubbles
                                .length)];
                            randomBubble.el.style.transform = 'scale(1.2)';
                            randomBubble.el.style.boxShadow =
                                '0 0 35px rgba(255,180,40,0.7), 0 8px 32px rgba(0,0,0,0.1), inset 0 -4px 12px rgba(255,255,255,0.5)';
                            setTimeout(() => {
                                randomBubble.el.style.transform = '';
                                randomBubble.el.style.boxShadow = '';
                            }, 1200);
                            lastInteraction = Date.now();
                        }
                    }
                }, 10000);
            }

            // ============ 全局事件 ============
            // 防止意外滚动和缩放
            document.addEventListener('gesturestart', (e) => e.preventDefault());
            document.addEventListener('gesturechange', (e) => e.preventDefault());
            document.addEventListener('gestureend', (e) => e.preventDefault());

            // 处理窗口大小变化
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    adjustForScreen();
                    repositionAllBubbles();
                    refillBubbles();
                }, 300);
            });

            // ============ 启动 ============
            init();
            console.log('🫧 泡泡学园已就绪！');
            console.log('   🌈 点击彩色泡泡开始学习之旅');
            console.log('   ⭐ 金色泡泡有惊喜奖励哦');
            console.log('   📱 支持手机和平板触摸操作');
            console.log('   🔊 语音播报功能已开启');
            console.log('   👶 专为0-3岁宝宝设计');
        })();
    </script>
</body>
</html>
