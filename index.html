<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>泡泡学园 - 宝宝的神奇花园</title>
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 16px); --safe-top: env(safe-area-inset-top, 12px); }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
        html, body { width:100vw; height:100vh; height:100dvh; overflow:hidden; font-family:sans-serif; background:linear-gradient(180deg, #c9e8f5, #e8d5f5, #fce4ec, #d4ecc8, #b8dba0); touch-action:manipulation; position:relative; }
        /* 全屏模拟 */
        body.fake-fullscreen { position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:linear-gradient(180deg, #c9e8f5, #e8d5f5, #fce4ec, #d4ecc8, #b8dba0); }
        body.fake-fullscreen .game-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000; background:inherit; }
        /* 旋转提示：默认不显示，不阻挡点击 */
        .rotate-hint {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); backdrop-filter:blur(10px);
            z-index:99999; display:none; flex-direction:column; align-items:center; justify-content:center;
            pointer-events:auto;
        }
        .rotate-hint.show { display:flex; }
        .rotate-icon { font-size:90px; animation:rotatePhone 1.8s infinite; }
        @keyframes rotatePhone { 0%{transform:rotate(0deg)} 25%{transform:rotate(90deg)} 75%{transform:rotate(90deg)} 100%{transform:rotate(0deg)} }
        .rotate-text { color:white; font-size:32px; font-weight:bold; margin-top:20px; }
        /* 解锁按钮 */
        .unlock-btn {
            position:fixed; top:15px; right:15px; z-index:99999;
            width:50px; height:50px; border-radius:50%;
            background:rgba(0,0,0,0.3); backdrop-filter:blur(10px);
            border:2px solid rgba(255,255,255,0.5); color:white; font-size:22px;
            display:none; align-items:center; justify-content:center; cursor:pointer;
        }
        .unlock-btn.show { display:flex; }
        .unlock-btn.hold { background:rgba(255,80,80,0.7); }
        /* 游戏容器 */
        .game-container { position:relative; z-index:10; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
        .top-bar { display:flex; align-items:center; gap:8px; padding:10px 16px; margin-top:var(--safe-top); background:rgba(255,255,255,0.85); border-radius:40px; backdrop-filter:blur(12px); z-index:100; }
        .star-count { font-size:26px; font-weight:900; color:#f59e0b; }
        .sound-btn,.lock-btn { padding:8px 14px; border:none; border-radius:25px; font-size:16px; font-weight:bold; background:rgba(255,255,255,0.9); cursor:pointer; }
        .lock-btn.active { background:#ff9800; color:white; }
        .bubble-area { flex:1; width:100%; position:relative; z-index:20; min-height:55vh; }
        .bubble { position:absolute; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; animation:bubbleFloat var(--float-duration,4s) infinite; background:radial-gradient(circle at 35% 30%,#fff,#ffffff80 25%,var(--bubble-color, #d0e0ff) 55%,#b4c8f0); border:2px solid rgba(255,255,255,0.6); }
        .bubble.popping { animation:popBubble 0.5s forwards !important; pointer-events:none; }
        @keyframes popBubble { 0%{transform:scale(1);opacity:1} 30%{transform:scale(1.5);opacity:0.7} 100%{transform:scale(2.2);opacity:0} }
        @keyframes bubbleFloat { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-18px)} }
        .bubble.golden { background:radial-gradient(circle at 35% 30%,#ffffdc,#fff0b4 25%,#ffd264 55%,#ffb43c); }
        .mode-bar { display:flex; gap:6px; padding:8px 12px; margin-bottom:var(--safe-bottom); background:rgba(255,255,255,0.85); border-radius:30px; backdrop-filter:blur(10px); z-index:100; }
        .mode-btn { padding:8px 12px; border-radius:20px; border:2px solid transparent; background:#f5f5f5; font-size:13px; font-weight:600; color:#777; }
        .mode-btn.active { background:#fff; border-color:#ff9800; color:#e65100; }
    </style>
</head>
<body>
    <div class="rotate-hint" id="rotateHint">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">请旋转手机</div>
        <div>横屏模式更适合宝宝玩耍哦～</div>
    </div>
    <div class="unlock-btn" id="unlockBtn">🔓</div>

    <div class="game-container" id="gameContainer">
        <div class="top-bar" id="topBar">
            <span>⭐</span> <span class="star-count" id="starCount">0</span>
            <span id="levelIndicator">🌱 开始探索</span>
            <button class="sound-btn" id="soundBtn">🔊</button>
            <button class="lock-btn" id="lockBtn">🔒 宝宝模式</button>
        </div>
        <div class="bubble-area" id="bubbleArea"></div>
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="mixed">🎪 混合</button>
            <button class="mode-btn" data-mode="animals">🐶 动物</button>
            <button class="mode-btn" data-mode="fruits">🍎 水果</button>
            <button class="mode-btn" data-mode="numbers">🔢 数字</button>
            <button class="mode-btn" data-mode="colors">🌈 颜色</button>
            <button class="mode-btn" data-mode="shapes">⭐ 形状</button>
        </div>
    </div>

    <script>
        (function() {
            // 元素
            const bubbleArea = document.getElementById('bubbleArea');
            const starCountEl = document.getElementById('starCount');
            const levelIndicator = document.getElementById('levelIndicator');
            const soundBtn = document.getElementById('soundBtn');
            const modeBar = document.getElementById('modeBar');
            const rotateHint = document.getElementById('rotateHint');
            const unlockBtn = document.getElementById('unlockBtn');
            const lockBtn = document.getElementById('lockBtn');

            // 状态
            let totalStars = 0, currentMode = 'mixed', soundEnabled = true;
            let bubbles = [], maxBubbles = 5, processing = false;
            let audioCtx = null;
            let isLocked = false, orientationWatcher = null;

            function setMaxBubbles() {
                const w = window.innerWidth;
                maxBubbles = (w < 400) ? 4 : (w < 600) ? 5 : (w < 900) ? 6 : 7;
            }
            setMaxBubbles();
            window.addEventListener('resize', () => { setMaxBubbles(); reposition(); });

            // 数据
            const chnNums = ['零','一','二','三','四','五','六','七','八','九','十'];
            const engNums = ['','one','two','three','four','five','six','seven','eight','nine','ten'];
            const animals = [
                {e:'🐶',c:'小狗',en:'dog',s:'汪汪汪'},{e:'🐱',c:'小猫',en:'cat',s:'喵喵喵'},
                {e:'🐰',c:'兔子',en:'rabbit',s:'蹦蹦跳'},{e:'🐮',c:'奶牛',en:'cow',s:'哞哞哞'}
            ];
            const fruits = [{e:'🍎',c:'苹果',en:'apple'},{e:'🍌',c:'香蕉',en:'banana'}];
            const colors = [{e:'🔴',c:'红色',en:'red',hex:'#ef5350'},{e:'🔵',c:'蓝色',en:'blue',hex:'#42a5f5'}];
            const shapes = [{c:'圆形',en:'circle',t:'circle'},{c:'方形',en:'square',t:'square'}];
            const numbers = [];
            for(let i=1;i<=10;i++) numbers.push({n:i, c:chnNums[i], en:engNums[i]});

            function getPool(mode) {
                switch(mode) {
                    case 'animals': return animals;
                    case 'fruits': return fruits;
                    case 'numbers': return numbers;
                    case 'colors': return colors;
                    case 'shapes': return shapes;
                    default: return [...animals, ...fruits, ...numbers, ...colors, ...shapes];
                }
            }

            // 音频
            function initAudio() {
                if(!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }
            function tone(f,dur) {
                if(!soundEnabled) return;
                const ctx = audioCtx; if(!ctx) return;
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'sine'; o.frequency.value = f;
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
                o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime+dur);
            }
            function popSound() { tone(600,0.15); setTimeout(()=>tone(900,0.1),60); }

            // 语音（极简稳定）
            function speak(text, rate=0.85) {
                if(!soundEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN'; u.rate = rate; u.pitch = 1.15;
                window.speechSynthesis.speak(u);
            }
            function speakItem(d) {
                if(!soundEnabled) return;
                let t = '';
                if(d.n !== undefined) t = `${d.c}！${d.en}`;
                else if(d.hex) t = `${d.c}！${d.en}`;
                else if(d.t) t = `${d.c}！${d.en}`;
                else if(d.s) t = `${d.c}！${d.s}！${d.en}`;
                else t = `${d.c}！${d.en}`;
                speak(t, 0.8);
            }

            // 泡泡逻辑
            function bubbleSize() { const w = window.innerWidth; return w<400?75:w<600?85:100; }
            function randPos(size) { const r = bubbleArea.getBoundingClientRect(); return {x:Math.random()*(r.width-size-20)+10, y:Math.random()*(r.height-size-20)+10}; }
            function tooClose(x,y,list,min) { return list.some(b=>Math.hypot(x-parseFloat(b.el.style.left),y-parseFloat(b.el.style.top))<min); }
            function makeBubble(data, gold) {
                const size = bubbleSize();
                const el = document.createElement('div');
                el.className = 'bubble' + (gold ? ' golden' : '');
                el.style.width = size+'px'; el.style.height = size+'px';
                el.style.setProperty('--float-duration', (Math.random()*2+3)+'s');
                el.style.setProperty('--bubble-color', 'rgba(255,220,240,0.4)');
                if(data.t) {
                    const d = document.createElement('div');
                    d.style.width = size*0.4+'px'; d.style.height = size*0.4+'px';
                    d.style.background = '#ff8a80'; d.style.borderRadius = data.t==='circle'?'50%':'6px';
                    el.appendChild(d);
                } else if(data.n !== undefined) {
                    const n = document.createElement('span');
                    n.style.fontSize = size*0.4+'px'; n.style.fontWeight = '900'; n.textContent = data.n;
                    el.appendChild(n);
                } else if(data.hex) {
                    const c = document.createElement('div');
                    c.style.width = size*0.45+'px'; c.style.height = size*0.45+'px';
                    c.style.borderRadius = '50%'; c.style.background = data.hex;
                    el.appendChild(c);
                } else {
                    const e = document.createElement('span');
                    e.style.fontSize = size*0.4+'px'; e.textContent = data.e;
                    el.appendChild(e);
                }
                el.addEventListener('click', function(e) {
                    if(processing || el.classList.contains('popping')) return;
                    popBubble(el, data, gold);
                });
                el.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if(processing || el.classList.contains('popping')) return;
                    popBubble(el, data, gold);
                });
                return el;
            }
            function popBubble(el, data, gold) {
                processing = true;
                const r = el.getBoundingClientRect();
                const cx = r.left+r.width/2, cy = r.top+r.height/2;
                el.classList.add('popping');
                popSound();
                if(gold) tone(1000,0.2);
                // 简单粒子
                for(let i=0;i< (gold?20:12); i++) {
                    const p = document.createElement('div');
                    p.style.cssText = `position:fixed;z-index:200;left:${cx}px;top:${cy}px;width:8px;height:8px;background:#ff6b6b;border-radius:50%;animation:fly 0.6s forwards;--dx:${(Math.random()-0.5)*100}px;--dy:${(Math.random()-0.5)*100}px;`;
                    document.body.appendChild(p);
                    setTimeout(()=>p.remove(),700);
                }
                totalStars += gold ? 3 : 1;
                starCountEl.textContent = totalStars;
                levelIndicator.textContent = totalStars>=50?'🌟智慧之星':totalStars>=20?'🎈学习达人':'🌱初学宝宝';
                speakItem(data);
                setTimeout(() => {
                    if(el.parentNode) el.remove();
                    bubbles = bubbles.filter(b => b.el !== el);
                    refill();
                    processing = false;
                }, 450);
            }
            function refill() {
                while(bubbles.filter(b=>!b.el.classList.contains('popping')).length < maxBubbles) spawnOne();
            }
            function spawnOne() {
                const pool = getPool(currentMode);
                if(!pool.length) return;
                const data = pool[Math.floor(Math.random()*pool.length)];
                const gold = Math.random() < 0.12;
                const el = makeBubble(data, gold);
                const size = bubbleSize();
                let pos, att=0;
                const act = bubbles.filter(b=>!b.el.classList.contains('popping'));
                do { pos = randPos(size); } while(tooClose(pos.x,pos.y,act,size*1.3) && att++<20);
                el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
                bubbleArea.appendChild(el);
                bubbles.push({el,data,gold});
            }
            function reposition() {
                const size = bubbleSize();
                const act = bubbles.filter(b=>!b.el.classList.contains('popping'));
                const tmp = [];
                act.forEach(b => {
                    let pos, att=0;
                    do { pos = randPos(size); } while(tooClose(pos.x,pos.y,tmp,size*1.2)&&att++<15);
                    b.el.style.left = pos.x+'px'; b.el.style.top = pos.y+'px';
                    tmp.push({el:b.el, x:pos.x, y:pos.y});
                });
            }
            function clearAll() { bubbles.forEach(b=>b.el.remove()); bubbles=[]; }

            // 模式
            modeBar.addEventListener('click', e => {
                const btn = e.target.closest('.mode-btn');
                if(!btn || btn.dataset.mode === currentMode) return;
                currentMode = btn.dataset.mode;
                modeBar.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                clearAll(); for(let i=0;i<maxBubbles;i++) spawnOne();
                speak({mixed:'混合模式',animals:'动物朋友',fruits:'水果乐园',numbers:'数字天地',colors:'彩虹颜色',shapes:'形状王国'}[currentMode],0.9);
            });

            // 声音
            soundBtn.addEventListener('click', ()=>{
                soundEnabled = !soundEnabled;
                soundBtn.textContent = soundEnabled?'🔊':'🔇';
                if(!soundEnabled) window.speechSynthesis?.cancel();
            });

            // 宝宝模式逻辑
            function isLandscape() { return window.innerWidth > window.innerHeight; }
            function showHint() { rotateHint.classList.add('show'); }
            function hideHint() { rotateHint.classList.remove('show'); }
            function clearWatcher() {
                if(orientationWatcher) {
                    window.removeEventListener('resize', orientationWatcher);
                    window.removeEventListener('orientationchange', orientationWatcher);
                    orientationWatcher = null;
                }
            }
            function requestFS() {
                const el = document.documentElement;
                const req = el.requestFullscreen || el.webkitRequestFullscreen;
                if(req) req.call(el).catch(()=>fakeFS());
                else fakeFS();
            }
            function fakeFS() {
                document.body.classList.add('fake-fullscreen');
                unlockBtn.classList.add('show');
            }
            function exitFS() {
                const ex = document.exitFullscreen || document.webkitExitFullscreen;
                if(ex) ex.call(document).catch(()=>{});
                document.body.classList.remove('fake-fullscreen');
                unlockBtn.classList.remove('show');
            }
            function startLock() {
                hideHint();
                clearWatcher();
                isLocked = true;
                lockBtn.textContent = '🔓 退出宝宝模式';
                lockBtn.classList.add('active');
                requestFS();
                if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
            }
            function enterLock() {
                if(isLandscape()) {
                    startLock();
                } else {
                    showHint();
                    speak('请旋转手机至横屏',0.9);
                    clearWatcher();
                    orientationWatcher = function() {
                        if(isLandscape()) startLock();
                    };
                    window.addEventListener('resize', orientationWatcher);
                    window.addEventListener('orientationchange', orientationWatcher);
                }
            }
            function exitLock() {
                if(!isLocked) return;
                isLocked = false;
                lockBtn.textContent = '🔒 宝宝模式';
                lockBtn.classList.remove('active');
                if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                exitFS();
                hideHint();
                clearWatcher();
                speak('已退出宝宝模式',0.9);
            }

            lockBtn.addEventListener('click', () => {
                if(isLocked) { speak('请长按右上角解锁',0.9); }
                else { enterLock(); }
            });

            let holdTimer;
            unlockBtn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                unlockBtn.classList.add('hold');
                holdTimer = setTimeout(exitLock, 2000);
            });
            unlockBtn.addEventListener('pointerup', () => {
                clearTimeout(holdTimer);
                unlockBtn.classList.remove('hold');
            });
            unlockBtn.addEventListener('pointerleave', () => {
                clearTimeout(holdTimer);
                unlockBtn.classList.remove('hold');
            });
            // 阻止旋转提示穿透点击
            rotateHint.addEventListener('click', e => e.stopPropagation());

            // 初始化
            function init() {
                initAudio();
                clearAll(); for(let i=0;i<maxBubbles;i++) spawnOne();
                hideHint();
                setTimeout(()=>speak('欢迎来到泡泡学园！',0.85),800);
                setInterval(refill,2000);
            }
            // 动态插入动画样式
            const style = document.createElement('style');
            style.textContent = '@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0;}}';
            document.head.appendChild(style);
            init();
        })();
    </script>
</body>
</html>
