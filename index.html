<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>泡泡学园 - 宝宝的神奇花园</title>
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --safe-top: env(safe-area-inset-top, 12px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
        html, body {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #c9e8f5 0%, #e8d5f5 25%, #fce4ec 55%, #d4ecc8 78%, #b8dba0 100%);
            touch-action: manipulation;
            position: relative;
        }
        /* 模拟全屏 */
        body.fake-fullscreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(180deg, #c9e8f5, #e8d5f5, #fce4ec, #d4ecc8, #b8dba0);
            margin:0; overflow:hidden; z-index:9999;
        }
        body.fake-fullscreen .game-container {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000;
            background:inherit;
        }
        body.fake-fullscreen .top-bar { margin-top: var(--safe-top); }
        body.fake-fullscreen .mode-bar { margin-bottom: var(--safe-bottom); }
        body.fake-fullscreen .unlock-btn { display:flex; }

        .rotate-hint { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; transition:opacity 0.3s; }
        .rotate-hint.hidden { opacity:0; pointer-events:none; }
        .rotate-icon { font-size:90px; animation:rotatePhone 1.8s ease-in-out infinite; }
        @keyframes rotatePhone { 0%{transform:rotate(0deg)} 25%{transform:rotate(90deg)} 75%{transform:rotate(90deg)} 100%{transform:rotate(0deg)} }
        .rotate-text { color:white; font-size:32px; font-weight:bold; margin-top:20px; }
        .rotate-sub { color:rgba(255,255,255,0.8); font-size:18px; margin-top:10px; }

        .unlock-btn { position:fixed; top:max(15px, var(--safe-top)); right:15px; z-index:99999; width:50px; height:50px; border-radius:50%; background:rgba(0,0,0,0.3); backdrop-filter:blur(10px); border:2px solid rgba(255,255,255,0.5); color:white; font-size:22px; display:none; align-items:center; justify-content:center; pointer-events:auto; transition:background 0.2s; cursor:pointer; }
        .unlock-btn.visible { display:flex; }
        .unlock-btn.holding { background:rgba(255,80,80,0.7); border-color:#ff5252; }

        .sky-clouds,.decor-flower { pointer-events:none; position:fixed; }
        .cloud { position:absolute; background:white; border-radius:50%; opacity:0.6; animation:cloudFloat linear infinite; }
        .cloud::before,.cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
        .cloud1 { width:90px; height:50px; top:8%; left:10%; animation-duration:35s; border-radius:50px; }
        .cloud1::before { width:55px; height:55px; top:-28px; left:15px; } .cloud1::after { width:40px; height:40px; top:-15px; left:45px; }
        .cloud2 { width:70px; height:38px; top:15%; left:55%; animation-duration:42s; border-radius:50px; }
        .cloud2::before { width:42px; height:42px; top:-22px; left:10px; } .cloud2::after { width:32px; height:32px; top:-10px; left:35px; }
        .cloud3 { width:80px; height:44px; top:22%; left:30%; animation-duration:38s; border-radius:50px; }
        .cloud3::before { width:48px; height:48px; top:-26px; left:12px; } .cloud3::after { width:36px; height:36px; top:-12px; left:40px; }
        @keyframes cloudFloat { 0%{transform:translateX(0)} 25%{transform:translateX(30px)} 50%{transform:translateX(-10px)} 75%{transform:translateX(20px)} 100%{transform:translateX(0)} }
        .decor-flower { font-size:28px; animation:flowerBob 4s ease-in-out infinite; }
        @keyframes flowerBob { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} 60%{transform:translateY(-3px)} }

        .game-container { position:relative; z-index:10; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; pointer-events:none; }
        .top-bar { pointer-events:auto; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; margin-top:var(--safe-top); background:rgba(255,255,255,0.85); border-radius:40px; box-shadow:0 4px 20px rgba(0,0,0,0.08); backdrop-filter:blur(12px); z-index:100; flex-wrap:wrap; }
        .star-display { display:flex; align-items:center; gap:4px; font-size:20px; font-weight:700; color:#f59e0b; }
        .star-icon { font-size:28px; animation:starPulse 2s infinite; }
        @keyframes starPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
        .star-count { font-size:26px; background:linear-gradient(135deg,#ffc107,#ff9800); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900; }
        .level-indicator { font-size:13px; color:#888; background:#f5f5f5; padding:4px 8px; border-radius:12px; }
        .sound-btn,.lock-btn { pointer-events:auto; border:none; border-radius:25px; padding:8px 14px; font-size:16px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:4px; background:rgba(255,255,255,0.9); box-shadow:0 2px 8px rgba(0,0,0,0.06); transition:all 0.2s; }
        .sound-btn:active,.lock-btn:active { transform:scale(0.93); }
        .lock-btn.active-mode { background:#ff9800; color:white; }

        .bubble-area { pointer-events:auto; flex:1; width:100%; position:relative; z-index:20; min-height:55vh; }
        .bubble { position:absolute; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.15s; animation:bubbleFloat var(--float-duration,4s) ease-in-out infinite; z-index:20; background:radial-gradient(circle at 35% 30%,#fff,#ffffff80 25%,var(--bubble-color) 55%,#b4c8f0); border:2px solid rgba(255,255,255,0.6); }
        .bubble::after { content:''; position:absolute; width:28%; height:18%; background:rgba(255,255,255,0.8); border-radius:50%; top:16%; left:20%; transform:rotate(-20deg); pointer-events:none; }
        .bubble:active { transform:scale(0.9); }
        .bubble.popping { animation:popBubble 0.5s ease-out forwards !important; pointer-events:none; }
        @keyframes popBubble { 0%{transform:scale(1);opacity:1} 30%{transform:scale(1.5);opacity:0.7} 100%{transform:scale(2.2);opacity:0} }
        @keyframes bubbleFloat { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-18px)} 50%{transform:translateY(-6px)} 75%{transform:translateY(-22px)} }
        .bubble.golden { background:radial-gradient(circle at 35% 30%,#ffffdc,#fff0b4 25%,#ffd264 55%,#ffb43c); border:3px solid rgba(255,200,60,0.8); box-shadow:0 8px 36px rgba(255,170,30,0.35),0 0 40px rgba(255,180,40,0.4); animation:bubbleFloat 3.5s ease-in-out infinite,goldenGlow 1.5s infinite; }
        @keyframes goldenGlow { 50%{box-shadow:0 8px 44px rgba(255,170,30,0.55),0 0 60px rgba(255,180,40,0.7)} }

        .mode-bar { pointer-events:auto; display:flex; gap:6px; padding:8px 12px; margin-bottom:var(--safe-bottom); background:rgba(255,255,255,0.85); border-radius:30px; box-shadow:0 -2px 16px rgba(0,0,0,0.06); backdrop-filter:blur(10px); z-index:100; flex-wrap:wrap; justify-content:center; }
        .mode-btn { padding:8px 12px; border-radius:20px; border:2px solid transparent; background:#f5f5f5; font-size:13px; cursor:pointer; font-weight:600; color:#777; }
        .mode-btn.active { background:#fff; border-color:#ff9800; color:#e65100; box-shadow:0 3px 12px rgba(255,152,0,0.2); }
        .celebrate-overlay { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:300; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>
    <div class="rotate-hint" id="rotateHint">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">请旋转手机</div>
        <div class="rotate-sub">横屏模式更适合宝宝玩耍哦～</div>
    </div>
    <div class="unlock-btn" id="unlockBtn">🔓</div>

    <div class="sky-clouds">
        <div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div>
    </div>
    <div class="decor-flower" style="bottom:14%;left:8%;">🌼</div>
    <div class="decor-flower" style="bottom:12%;left:22%;font-size:22px;">🌸</div>
    <div class="decor-flower" style="bottom:15%;right:12%;">🌻</div>
    <div class="decor-flower" style="bottom:11%;right:25%;font-size:24px;">🌷</div>

    <div class="game-container" id="gameContainer">
        <div class="top-bar" id="topBar">
            <span class="star-icon">⭐</span>
            <div class="star-display"><span class="star-count" id="starCount">0</span></div>
            <span class="level-indicator" id="levelIndicator">🌱 开始探索</span>
            <button class="sound-btn" id="soundBtn">🔊</button>
            <button class="lock-btn" id="lockBtn">🔒 宝宝模式</button>
        </div>
        <div class="bubble-area" id="bubbleArea"></div>
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="mixed">🎪 混合</button>
            <button class="mode-btn" data-mode="animals">🐶 动物</button>
            <button class="mode-btn" data-mode="fruits">🍎 水果</button>
            <button class="mode-btn" data-mode="numbers">🔢 数字</button>
            <button class="mode-btn" data-mode="colors">🌈 颜色</button>
            <button class="mode-btn" data-mode="shapes">⭐ 形状</button>
        </div>
    </div>
    <div class="celebrate-overlay" id="celebrateOverlay"></div>

    <script>
        (function() {
            const bubbleArea = document.getElementById('bubbleArea');
            const starCountEl = document.getElementById('starCount');
            const levelIndicator = document.getElementById('levelIndicator');
            const celebrateOverlay = document.getElementById('celebrateOverlay');
            const soundBtn = document.getElementById('soundBtn');
            const modeBar = document.getElementById('modeBar');
            const topBar = document.getElementById('topBar');
            const rotateHint = document.getElementById('rotateHint');
            const unlockBtn = document.getElementById('unlockBtn');
            const lockBtn = document.getElementById('lockBtn');
            const gameContainer = document.getElementById('gameContainer');

            let totalStars = 0, currentMode = 'mixed', soundEnabled = true;
            let bubbles = [], maxBubbles = 5, isProcessing = false;
            let audioCtx = null, speechQueue = [], isSpeaking = false;
            let isLockedMode = false, unlockTimer = null;

            function adjustForScreen() {
                const w = window.innerWidth;
                if(w<400) maxBubbles=4; else if(w<600) maxBubbles=5; else if(w<900) maxBubbles=6; else maxBubbles=7;
            }
            adjustForScreen();
            window.addEventListener('resize',()=>{ adjustForScreen(); repositionAllBubbles(); });
            window.addEventListener('orientationchange',()=>{ setTimeout(()=>{ adjustForScreen(); repositionAllBubbles(); checkOrientation(); },400); });

            const chineseNumbers = ['零','一','二','三','四','五','六','七','八','九','十'];
            const englishNumbers = ['','one','two','three','four','five','six','seven','eight','nine','ten'];
            const dataAnimals = [
                {emoji:'🐶',cn:'小狗',en:'dog',sound:'汪汪汪'},{emoji:'🐱',cn:'小猫',en:'cat',sound:'喵喵喵'},
                {emoji:'🐰',cn:'兔子',en:'rabbit',sound:'蹦蹦跳'},{emoji:'🐮',cn:'奶牛',en:'cow',sound:'哞哞哞'},
                {emoji:'🐔',cn:'小鸡',en:'chicken',sound:'叽叽叽'},{emoji:'🐷',cn:'小猪',en:'pig',sound:'哼哼哼'},
                {emoji:'🐘',cn:'大象',en:'elephant',sound:'长鼻子大象'},{emoji:'🦆',cn:'鸭子',en:'duck',sound:'嘎嘎嘎'}
            ];
            const dataFruits = [
                {emoji:'🍎',cn:'苹果',en:'apple'},{emoji:'🍌',cn:'香蕉',en:'banana'},
                {emoji:'🍊',cn:'橙子',en:'orange'},{emoji:'🍓',cn:'草莓',en:'strawberry'}
            ];
            const dataColors = [
                {emoji:'🔴',cn:'红色',en:'red',colorHex:'#ef5350'},{emoji:'🔵',cn:'蓝色',en:'blue',colorHex:'#42a5f5'},
                {emoji:'🟢',cn:'绿色',en:'green',colorHex:'#66bb6a'},{emoji:'🟡',cn:'黄色',en:'yellow',colorHex:'#fdd835'}
            ];
            const dataShapes = [
                {cn:'圆形',en:'circle',shapeType:'circle'},{cn:'方形',en:'square',shapeType:'square'},
                {cn:'三角形',en:'triangle',shapeType:'triangle'},{cn:'星形',en:'star',shapeType:'star'}
            ];
            const dataNumbers = [];
            for(let i=1;i<=10;i++) dataNumbers.push({number:i, cn:chineseNumbers[i], en:englishNumbers[i]});

            function getDataForMode(mode) {
                switch(mode){
                    case 'animals': return dataAnimals;
                    case 'fruits': return dataFruits;
                    case 'numbers': return dataNumbers;
                    case 'colors': return dataColors;
                    case 'shapes': return dataShapes;
                    default: return [...dataAnimals.map(d=>({...d,category:'animal'})),...dataFruits.map(d=>({...d,category:'fruit'})),...dataNumbers.map(d=>({...d,category:'number'})),...dataColors.map(d=>({...d,category:'color'})),...dataShapes.map(d=>({...d,category:'shape'}))];
                }
            }

            function getAudioContext() {
                if(!audioCtx) try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
                if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
                return audioCtx;
            }
            function playTone(freq,dur,type='sine',vol=0.08){ if(!soundEnabled)return; const ctx=getAudioContext(); if(!ctx)return; const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur); }
            function playPopSound(){ playTone(600,0.15); setTimeout(()=>playTone(900,0.1),60); }
            function playStarSound(){ playTone(800,0.12); }

            // ========== 优化后的语音队列 ==========
            function speak(text, rate=0.85){
                if(!soundEnabled) return;
                speechQueue.push({text, rate});
                if(!isSpeaking) processSpeechQueue();
            }
            function processSpeechQueue(){
                if(!speechQueue.length){
                    isSpeaking = false;
                    return;
                }
                isSpeaking = true;
                const {text, rate} = speechQueue.shift();
                if(!('speechSynthesis' in window)){
                    isSpeaking = false;
                    processSpeechQueue();
                    return;
                }
                // 不再全局 cancel，让语音按顺序播放
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                u.rate = rate;
                u.pitch = 1.15;
                u.onend = () => {
                    // 加小延迟确保引擎释放
                    setTimeout(() => {
                        isSpeaking = false;
                        processSpeechQueue();
                    }, 80);
                };
                u.onerror = () => {
                    isSpeaking = false;
                    processSpeechQueue();
                };
                window.speechSynthesis.speak(u);
            }

            function speakItemData(d){ 
                if(!soundEnabled) return;
                let t='';
                if(d.number!==undefined) t = `${d.cn}！${d.en}`;
                else if(d.colorHex) t = `${d.cn}！${d.en}`;
                else if(d.shapeType) t = `${d.cn}！${d.en}`;
                else if(d.sound) t = `${d.cn}！${d.sound}！${d.en}`;
                else t = `${d.cn}！${d.en}`;
                speak(t, 0.8);
            }

            function spawnParticles(x,y,count=12){
                const colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff'];
                for(let i=0;i<count;i++){
                    const p=document.createElement('div'); p.style.cssText=`position:fixed;pointer-events:none;z-index:200;left:${x}px;top:${y}px;width:8px;height:8px;background:${colors[i%colors.length]};border-radius:50%;animation:fly 0.6s ease-out forwards;--dx:${(Math.random()-0.5)*100}px;--dy:${(Math.random()-0.5)*100}px;`;
                    document.body.appendChild(p); setTimeout(()=>p.remove(),700);
                }
                if(!document.getElementById('particle-keyframes')){
                    const style=document.createElement('style'); style.id='particle-keyframes';
                    style.textContent='@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0;}}';
                    document.head.appendChild(style);
                }
            }
            function spawnFlyingStar(x,y,target){
                const r=target.getBoundingClientRect();
                const star=document.createElement('div'); star.style.cssText=`position:fixed;pointer-events:none;z-index:250;font-size:28px;left:${x}px;top:${y}px;animation:flyStar 0.7s ease-out forwards;--tx:${r.left+r.width/2-x}px;--ty:${r.top+r.height/2-y}px;`;
                star.textContent='⭐'; document.body.appendChild(star); playStarSound(); setTimeout(()=>star.remove(),750);
                if(!document.getElementById('star-keyframes')){
                    const style=document.createElement('style'); style.id='star-keyframes';
                    style.textContent='@keyframes flyStar{to{transform:translate(var(--tx),var(--ty)) scale(0.5);opacity:0.7;}}';
                    document.head.appendChild(style);
                }
            }
            function celebrateMilestone(){
                const texts=['🎉 太棒了！','🌟 真聪明！','👏 好厉害！','💖 宝宝真棒！'];
                const el=document.createElement('div'); el.style.cssText='font-size:60px;font-weight:900;animation:bounce 0.6s ease-out;';
                el.textContent=texts[Math.floor(Math.random()*texts.length)];
                celebrateOverlay.appendChild(el);
                for(let i=0;i<20;i++){ const c=document.createElement('div'); c.textContent='🌟'; c.style.cssText=`position:fixed;z-index:290;font-size:24px;left:${Math.random()*90}%;top:-30px;animation:fall 2.5s ease-in forwards;animation-delay:${Math.random()*0.5}s;`; celebrateOverlay.appendChild(c); }
                setTimeout(()=>celebrateOverlay.innerHTML='',2500);
            }

            function getBubbleSize(){ const w=window.innerWidth; return w<400?75:w<600?85:100; }
            function getRandomPosition(size){ const r=bubbleArea.getBoundingClientRect(); return {x:Math.random()*(r.width-size-20)+10, y:Math.random()*(r.height-size-20)+10}; }
            function isTooClose(x,y,list,min){ return list.some(b=>Math.hypot(x-parseFloat(b.el.style.left),y-parseFloat(b.el.style.top))<min); }
            function createBubbleElement(data, golden=false){
                const size=getBubbleSize(); const el=document.createElement('div'); el.className='bubble'+(golden?' golden':'');
                el.style.cssText=`width:${size}px;height:${size}px;--float-duration:${Math.random()*2+3}s;--float-delay:${Math.random()*3}s;--bubble-color:rgba(255,220,240,0.4);`;
                if(data.shapeType){ const d=document.createElement('div'); d.style.cssText=`width:${size*0.4}px;height:${size*0.4}px;background:#ff8a80;border-radius:${data.shapeType==='circle'?'50%':'6px'};`; el.appendChild(d); }
                else if(data.number!==undefined){ const n=document.createElement('span'); n.style.fontSize=size*0.4+'px'; n.style.fontWeight='900'; n.textContent=data.number; el.appendChild(n); }
                else if(data.colorHex){ const c=document.createElement('div'); c.style.cssText=`width:${size*0.45}px;height:${size*0.45}px;border-radius:50%;background:${data.colorHex};`; el.appendChild(c); }
                else{ const e=document.createElement('span'); e.style.fontSize=size*0.4+'px'; e.textContent=data.emoji; el.appendChild(e); }
                el.addEventListener('click',(e)=>{ if(isProcessing||el.classList.contains('popping'))return; handleBubbleClick(el,data,golden); });
                el.addEventListener('touchend',(e)=>{ if(isProcessing||el.classList.contains('popping'))return; e.preventDefault(); handleBubbleClick(el,data,golden); });
                return el;
            }
            function handleBubbleClick(el,data,golden){
                isProcessing=true; const r=el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
                el.classList.add('popping'); playPopSound(); if(golden) playTone(1000,0.2);
                spawnParticles(cx,cy,golden?20:12); spawnFlyingStar(cx,cy,topBar);
                totalStars+=golden?3:1; updateStarDisplay(); speakItemData(data);
                if(totalStars%10===0) setTimeout(celebrateMilestone,400);
                setTimeout(()=>{ if(el.parentNode)el.remove(); bubbles=bubbles.filter(b=>b.el!==el); refillBubbles(); isProcessing=false; },450);
            }
            function updateStarDisplay(){ starCountEl.textContent=totalStars; levelIndicator.textContent=totalStars>=50?'🌟 智慧之星':totalStars>=20?'🎈 学习达人':'🌱 初学宝宝'; }
            function refillBubbles(){ while(bubbles.filter(b=>!b.el.classList.contains('popping')).length<maxBubbles) spawnOneBubble(); }
            function spawnOneBubble(){
                const pool=getDataForMode(currentMode); if(!pool.length)return;
                const data=pool[Math.floor(Math.random()*pool.length)], golden=Math.random()<0.12;
                const el=createBubbleElement(data,golden), size=getBubbleSize();
                let pos,attempts=0; const active=bubbles.filter(b=>!b.el.classList.contains('popping'));
                do{ pos=getRandomPosition(size); }while(isTooClose(pos.x,pos.y,active,size*1.3)&&attempts++<20);
                el.style.left=pos.x+'px'; el.style.top=pos.y+'px';
                bubbleArea.appendChild(el); bubbles.push({el,data,golden});
            }
            function repositionAllBubbles(){
                const size=getBubbleSize(), active=bubbles.filter(b=>!b.el.classList.contains('popping'));
                const temp=[];
                active.forEach(b=>{ let pos,att=0; do{ pos=getRandomPosition(size); }while(isTooClose(pos.x,pos.y,temp,size*1.2)&&att++<15); b.el.style.left=pos.x+'px'; b.el.style.top=pos.y+'px'; temp.push({el:b.el,x:pos.x,y:pos.y}); });
            }
            function clearAllBubbles(){ bubbles.forEach(b=>b.el.remove()); bubbles=[]; speechQueue=[]; window.speechSynthesis?.cancel(); isSpeaking=false; }
            function initBubbles(){ clearAllBubbles(); for(let i=0;i<maxBubbles;i++) spawnOneBubble(); }

            modeBar.addEventListener('click',e=>{
                const btn=e.target.closest('.mode-btn'); if(!btn||btn.dataset.mode===currentMode)return;
                currentMode=btn.dataset.mode;
                document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
                initBubbles(); speak({mixed:'混合模式',animals:'动物朋友',fruits:'水果乐园',numbers:'数字天地',colors:'彩虹颜色',shapes:'形状王国'}[currentMode],0.9);
            });
            soundBtn.addEventListener('click',()=>{ soundEnabled=!soundEnabled; soundBtn.textContent=soundEnabled?'🔊':'🔇'; if(!soundEnabled){ speechQueue=[]; window.speechSynthesis?.cancel(); isSpeaking=false; } });

            function isLandscape(){ return window.innerWidth>window.innerHeight; }
            function checkOrientation(){
                if(!isLockedMode) rotateHint.classList.toggle('hidden', isLandscape()||window.innerWidth>=768);
                else rotateHint.classList.add('hidden');
            }
            window.addEventListener('resize',checkOrientation);

            function requestFullscreen(){
                const el = document.documentElement;
                const request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if(request){
                    request.call(el).then(() => document.body.classList.remove('fake-fullscreen')).catch(() => enableFakeFullscreen());
                } else {
                    enableFakeFullscreen();
                }
            }
            function enableFakeFullscreen(){
                document.body.classList.add('fake-fullscreen');
                window.scrollTo(0,1);
                document.body.addEventListener('touchmove', preventScroll, {passive: false});
                unlockBtn.classList.add('visible');
                if(soundEnabled) speak('已进入宝宝模式，长按右上角解锁退出',0.9);
            }
            function preventScroll(e){ e.preventDefault(); }
            function exitFullscreen(){
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if(exit) exit.call(document).catch(()=>{});
                document.body.classList.remove('fake-fullscreen');
                unlockBtn.classList.remove('visible');
                document.body.removeEventListener('touchmove', preventScroll);
            }
            function lockOrientation(){ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }
            function unlockOrientation(){ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }

            function enterLockMode(){
                if(isLockedMode)return;
                isLockedMode=true;
                lockBtn.textContent='🔓 退出宝宝模式'; lockBtn.classList.add('active-mode');
                rotateHint.classList.add('hidden');
                requestFullscreen();
                lockOrientation();
            }
            function exitLockMode(){
                if(!isLockedMode)return;
                isLockedMode=false;
                lockBtn.textContent='🔒 宝宝模式'; lockBtn.classList.remove('active-mode');
                unlockOrientation();
                exitFullscreen();
                checkOrientation();
                speak('已退出宝宝模式',0.9);
            }
            lockBtn.addEventListener('click',()=>{ if(isLockedMode) speak('请长按右上角解锁',0.9); else enterLockMode(); });
            function startHold(e){ e.preventDefault(); unlockBtn.classList.add('holding'); unlockTimer=setTimeout(exitLockMode,2000); }
            function cancelHold(e){ e.preventDefault(); unlockBtn.classList.remove('holding'); clearTimeout(unlockTimer); }
            unlockBtn.addEventListener('pointerdown',startHold); unlockBtn.addEventListener('pointerup',cancelHold);
            unlockBtn.addEventListener('pointerleave',cancelHold);
            unlockBtn.addEventListener('touchstart',e=>{e.preventDefault();startHold(e);});
            unlockBtn.addEventListener('touchend',cancelHold);
            checkOrientation();

            init();
            function init(){ getAudioContext(); initBubbles(); updateStarDisplay(); setTimeout(()=>speak('欢迎来到泡泡学园！',0.85),800); setInterval(refillBubbles,2000); }
        })();
    </script>
</body>
</html>
