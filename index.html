<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>智慧泡泡花园</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E8F5E9'/><circle cx='25' cy='75' r='12' fill='%23C8E6C9' opacity='0.6'/><circle cx='80' cy='20' r='8' fill='%23C8E6C9' opacity='0.6'/><circle cx='70' cy='85' r='10' fill='%23C8E6C9' opacity='0.6'/><circle cx='15' cy='15' r='6' fill='%23C8E6C9' opacity='0.6'/><circle cx='50' cy='45' r='32' fill='white' stroke='%23A5D6A7' stroke-width='3'/><ellipse cx='38' cy='33' rx='10' ry='5' fill='white'/><polygon points='50,28 58,38 70,38 60,46 64,58 50,50 36,58 40,46 30,38 42,38' fill='%238BC34A'/><path d='M 22 60 C 10 50, 15 35, 22 35 C 25 45, 28 55, 22 60 Z' fill='%23C8E6C9'/><path d='M 78 60 C 90 50, 85 35, 78 35 C 75 45, 72 55, 78 60 Z' fill='%23C8E6C9'/></svg>">
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --safe-top: env(safe-area-inset-top, 12px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }
        body {
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #c9e8f5 0%, #e8d5f5 25%, #fce4ec 55%, #d4ecc8 78%, #b8dba0 100%);
            touch-action: manipulation;
            position: relative;
        }

        .unlock-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top, 15px));
            right: 15px;
            z-index: 9998;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-size: 22px;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            transition: background 0.2s;
            cursor: pointer;
        }
        .unlock-btn.visible {
            display: flex;
        }
        .unlock-btn.holding {
            background: rgba(255, 80, 80, 0.6);
            border-color: #ff5252;
        }

        .sky-clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 0;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: cloudFloat linear infinite;
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 {
            width: 90px;
            height: 50px;
            top: 8%;
            left: 10%;
            animation-duration: 35s;
            border-radius: 50px;
        }
        .cloud1::before {
            width: 55px;
            height: 55px;
            top: -28px;
            left: 15px;
        }
        .cloud1::after {
            width: 40px;
            height: 40px;
            top: -15px;
            left: 45px;
        }
        .cloud2 {
            width: 70px;
            height: 38px;
            top: 15%;
            left: 55%;
            animation-duration: 42s;
            animation-delay: -10s;
            border-radius: 50px;
        }
        .cloud2::before {
            width: 42px;
            height: 42px;
            top: -22px;
            left: 10px;
        }
        .cloud2::after {
            width: 32px;
            height: 32px;
            top: -10px;
            left: 35px;
        }
        .cloud3 {
            width: 80px;
            height: 44px;
            top: 22%;
            left: 30%;
            animation-duration: 38s;
            animation-delay: -20s;
            border-radius: 50px;
        }
        .cloud3::before {
            width: 48px;
            height: 48px;
            top: -26px;
            left: 12px;
        }
        .cloud3::after {
            width: 36px;
            height: 36px;
            top: -12px;
            left: 40px;
        }

        @keyframes cloudFloat {
            0% { transform: translateX(0); }
            25% { transform: translateX(30px); }
            50% { transform: translateX(-10px); }
            75% { transform: translateX(20px); }
            100% { transform: translateX(0); }
        }

        .ground-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18%;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(168, 216, 160, 0.35) 30%, rgba(124, 184, 120, 0.55) 70%, rgba(100, 160, 95, 0.7) 100%);
            border-radius: 60% 70% 0 0 / 40% 40% 0 0;
        }

        .decor-flower {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            font-size: 28px;
            animation: flowerBob 4s ease-in-out infinite;
        }
        @keyframes flowerBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-8px) rotate(3deg); }
            60% { transform: translateY(-3px) rotate(-2deg); }
        }

        .game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            pointer-events: none;
        }

        .top-bar {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            margin-top: var(--safe-top);
            background: rgba(255,255,255,0.85);
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            transition: all 0.3s ease;
            flex-wrap: wrap;
        }
        .star-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 700;
            color: #f59e0b;
        }
        .star-icon {
            font-size: 30px;
            animation: starPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(245, 158, 11, 0.5));
        }
        @keyframes starPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
        .star-count {
            font-size: 28px;
            min-width: 40px;
            text-align: center;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        .level-indicator {
            font-size: 14px;
            color: #888;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 15px;
            letter-spacing: 0.5px;
        }
        .sound-btn {
            pointer-events: auto;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .sound-btn:active {
            transform: scale(0.9);
            background: #e0e0e0;
        }
        .sound-btn.muted {
            background: #ffebee;
            opacity: 0.7;
        }
        .lock-btn {
            pointer-events: auto;
            border: none;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            margin-left: 8px;
        }
        .lock-btn:active {
            transform: scale(0.93);
            background: #f0f0f0;
        }
        .lock-btn.active-mode {
            background: #ff9800;
            color: white;
            box-shadow: 0 4px 20px rgba(255,152,0,0.4);
        }

        .bubble-area {
            pointer-events: auto;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 20;
            min-height: 55vh;
            overflow: visible;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            animation: bubbleFloat var(--float-duration, 4s) ease-in-out infinite;
            animation-delay: var(--float-delay, 0s);
            z-index: 20;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 -4px 12px rgba(255, 255, 255, 0.5),
                inset 0 4px 12px rgba(255, 255, 255, 0.8);
            background: radial-gradient(circle at 35% 30%,
                    rgba(255, 255, 255, 0.85) 0%,
                    rgba(255, 255, 255, 0.5) 25%,
                    var(--bubble-color, rgba(200, 220, 255, 0.45)) 55%,
                    rgba(180, 200, 240, 0.35) 100%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }
        .bubble::after {
            content: '';
            position: absolute;
            width: 28%;
            height: 18%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            top: 16%;
            left: 20%;
            transform: rotate(-20deg);
            pointer-events: none;
        }
        .bubble:active {
            transform: scale(0.9);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12),
                inset 0 -2px 8px rgba(255, 255, 255, 0.4),
                inset 0 2px 8px rgba(255, 255, 255, 0.7);
        }
        .bubble.popping {
            animation: popBubble 0.5s ease-out forwards !important;
            pointer-events: none;
        }
        @keyframes popBubble {
            0% { transform: scale(1); opacity: 1; }
            30% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-18px) translateX(8px); }
            50% { transform: translateY(-6px) translateX(-4px); }
            75% { transform: translateY(-22px) translateX(6px); }
        }
        .bubble .bubble-emoji {
            font-size: var(--emoji-size, 38px);
            pointer-events: none;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.08));
            transition: transform 0.2s;
        }
        .bubble .bubble-number {
            font-size: var(--emoji-size, 36px);
            font-weight: 900;
            pointer-events: none;
            position: relative;
            z-index: 2;
            color: #5d4037;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }
        .bubble .bubble-shape {
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        .bubble.golden {
            background: radial-gradient(circle at 35% 30%,
                    rgba(255, 255, 220, 0.9) 0%,
                    rgba(255, 240, 180, 0.6) 25%,
                    rgba(255, 210, 100, 0.5) 55%,
                    rgba(255, 180, 60, 0.4) 100%);
            border: 3px solid rgba(255, 200, 60, 0.8);
            box-shadow: 0 8px 36px rgba(255, 170, 30, 0.35),
                inset 0 -4px 12px rgba(255, 255, 200, 0.6),
                inset 0 4px 12px rgba(255, 255, 200, 0.9),
                0 0 40px rgba(255, 180, 40, 0.4);
            animation: bubbleFloat var(--float-duration, 3.5s) ease-in-out infinite,
                goldenGlow 1.5s ease-in-out infinite !important;
            animation-delay: var(--float-delay, 0s), 0s;
        }
        @keyframes goldenGlow {
            0%, 100% { box-shadow: 0 8px 36px rgba(255, 170, 30, 0.35), inset 0 -4px 12px rgba(255, 255, 200, 0.6), inset 0 4px 12px rgba(255, 255, 200, 0.9), 0 0 40px rgba(255, 180, 40, 0.4); }
            50% { box-shadow: 0 8px 44px rgba(255, 170, 30, 0.55), inset 0 -4px 12px rgba(255, 255, 200, 0.7), inset 0 4px 12px rgba(255, 255, 200, 0.95), 0 0 60px rgba(255, 180, 40, 0.7); }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            border-radius: 50%;
            animation: particleFly 0.8s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
        }

        .flying-star {
            position: fixed;
            pointer-events: none;
            z-index: 250;
            font-size: 28px;
            animation: flyToTarget 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes flyToTarget {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            60% { transform: translate(calc(var(--tx) * 0.7), calc(var(--ty) * 0.7)) scale(1.4); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0.7; }
        }

        .celebrate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .celebrate-text {
            font-size: 60px;
            font-weight: 900;
            animation: celebBounce 0.6s ease-out forwards;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }
        @keyframes celebBounce {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.4); opacity: 1; }
            70% { transform: scale(0.85); }
            100% { transform: scale(1); opacity: 1; }
        }
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 290;
            font-size: 24px;
            animation: confettiFall 2.5s ease-in forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-60px) rotate(0deg) scale(1); opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        .mode-bar {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            margin-bottom: var(--safe-bottom);
            background: rgba(255,255,255,0.85);
            border-radius: 30px;
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }
        .mode-btn {
            padding: 9px 15px;
            border-radius: 22px;
            border: 2px solid transparent;
            background: #f5f5f5;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            color: #777;
            transition: all 0.25s;
            white-space: nowrap;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .mode-btn:active {
            transform: scale(0.93);
        }
        .mode-btn.active {
            background: #fff;
            border-color: #ff9800;
            color: #e65100;
            box-shadow: 0 3px 12px rgba(255, 152, 0, 0.2);
            font-weight: 700;
        }
        .mode-btn .mode-emoji {
            font-size: 18px;
            margin-right: 2px;
        }

        @media (max-width: 480px) {
            .bubble { width: 75px !important; height: 75px !important; }
            .bubble .bubble-emoji { font-size: 30px !important; }
            .bubble .bubble-number { font-size: 28px !important; }
            .mode-btn { padding: 7px 10px; font-size: 12px; border-radius: 18px; }
            .mode-btn .mode-emoji { font-size: 15px; }
            .top-bar { padding: 10px 14px; gap: 8px; border-radius: 30px; }
            .star-icon { font-size: 24px; }
            .star-count { font-size: 22px; }
            .mode-bar { gap: 4px; padding: 8px 10px; border-radius: 24px; }
            .lock-btn { padding: 6px 12px; font-size: 16px; }
        }
        @media (min-width: 768px) {
            .bubble { width: 110px !important; height: 110px !important; }
            .bubble .bubble-emoji { font-size: 46px !important; }
            .bubble .bubble-number { font-size: 44px !important; }
            .mode-btn { padding: 10px 18px; font-size: 16px; }
        }
        @media (min-width: 1024px) {
            .bubble { width: 120px !important; height: 120px !important; }
            .bubble .bubble-emoji { font-size: 50px !important; }
            .bubble .bubble-number { font-size: 48px !important; }
        }
    </style>
</head>
<body>

    <div class="unlock-btn" id="unlockBtn">🔓</div>

    <div class="sky-clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>
    <div class="ground-decoration"></div>
    <div class="decor-flower" style="bottom:14%;left:8%;animation-delay:0s;">🌼</div>
    <div class="decor-flower" style="bottom:12%;left:22%;animation-delay:1.2s;font-size:22px;">🌸</div>
    <div class="decor-flower" style="bottom:15%;right:12%;animation-delay:2.5s;">🌻</div>
    <div class="decor-flower" style="bottom:11%;right:25%;animation-delay:0.8s;font-size:24px;">🌷</div>
    <div class="decor-flower" style="bottom:16%;left:40%;animation-delay:3s;font-size:20px;">💐</div>
    <div class="decor-flower" style="bottom:13%;right:38%;animation-delay:1.8s;font-size:26px;">🌺</div>

    <div class="game-container" id="gameContainer">
        <div class="top-bar" id="topBar">
            <span class="star-icon">⭐</span>
            <div class="star-display">
                <span class="star-count" id="starCount">0</span>
            </div>
            <span class="level-indicator" id="levelIndicator">🌱 开始探索</span>
            <button class="sound-btn" id="soundBtn" aria-label="声音开关">🔊</button>
            <button class="lock-btn" id="lockBtn">🔒 宝宝模式</button>
        </div>

        <div class="bubble-area" id="bubbleArea"></div>

        <div class="mode-bar" id="modeBar">
            <button class="mode-btn active" data-mode="mixed"><span class="mode-emoji">🎪</span> 混合</button>
            <button class="mode-btn" data-mode="animals"><span class="mode-emoji">🐶</span> 动物</button>
            <button class="mode-btn" data-mode="fruits"><span class="mode-emoji">🍎</span> 水果</button>
            <button class="mode-btn" data-mode="vegetables"><span class="mode-emoji">🥦</span> 蔬菜</button>
            <button class="mode-btn" data-mode="numbers"><span class="mode-emoji">🔢</span> 数字</button>
            <button class="mode-btn" data-mode="letters"><span class="mode-emoji">🔤</span> 字母</button>
            <button class="mode-btn" data-mode="pinyin"><span class="mode-emoji">📖</span> 拼音</button>
            <button class="mode-btn" data-mode="colors"><span class="mode-emoji">🌈</span> 颜色</button>
            <button class="mode-btn" data-mode="shapes"><span class="mode-emoji">⭐</span> 形状</button>
            <button class="mode-btn" data-mode="furniture"><span class="mode-emoji">🪑</span> 家具</button>
            <button class="mode-btn" data-mode="vehicles"><span class="mode-emoji">🚗</span> 汽车</button>
            <button class="mode-btn" data-mode="daily_items"><span class="mode-emoji">🧴</span> 生活用品</button>
        </div>
    </div>
    <div class="celebrate-overlay" id="celebrateOverlay"></div>

    <script>
        (function() {
            const bubbleArea = document.getElementById('bubbleArea');
            const starCountEl = document.getElementById('starCount');
            const levelIndicator = document.getElementById('levelIndicator');
            const celebrateOverlay = document.getElementById('celebrateOverlay');
            const soundBtn = document.getElementById('soundBtn');
            const modeBar = document.getElementById('modeBar');
            const topBar = document.getElementById('topBar');
            const unlockBtn = document.getElementById('unlockBtn');
            const lockBtn = document.getElementById('lockBtn');

            let totalStars = 0;
            let currentMode = 'mixed';
            let soundEnabled = true;
            let bubbles = [];
            let maxBubbles = 5;
            let isProcessing = false;
            let audioCtx = null;
            let speechQueue = [];
            let isSpeaking = false;
            let isLockedMode = false;
            let unlockTimer = null;

            function adjustForScreen() {
                const w = window.innerWidth;
                if (w < 400) maxBubbles = 4;
                else if (w < 600) maxBubbles = 5;
                else if (w < 900) maxBubbles = 6;
                else maxBubbles = 7;
            }
            adjustForScreen();
            window.addEventListener('resize', () => { adjustForScreen(); repositionAllBubbles(); });

            // ============ 数据定义 ============
            const dataAnimals = [
                { emoji: '🐶', cn: '小狗', en: 'dog', sound: '汪汪汪' },
                { emoji: '🐱', cn: '小猫', en: 'cat', sound: '喵喵喵' },
                { emoji: '🐰', cn: '兔子', en: 'rabbit', sound: '蹦蹦跳' },
                { emoji: '🐮', cn: '奶牛', en: 'cow', sound: '哞哞哞' },
                { emoji: '🐔', cn: '小鸡', en: 'chicken', sound: '叽叽叽' },
                { emoji: '🐷', cn: '小猪', en: 'pig', sound: '哼哼哼' },

            // ============ 音频系统 ============
            function getAudioContext() {
                if (!audioCtx) {
                    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }
            function playTone(freq, duration, type = 'sine', vol = 0.08) {
                if (!soundEnabled) return;
                try {
                    const ctx = getAudioContext();
                    if (!ctx) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) { /* 静默处理 */ }
            }
            function playPopSound() {
                playTone(600, 0.15);
                setTimeout(() => playTone(900, 0.1), 60);
                setTimeout(() => playTone(1200, 0.08), 110);

            // ============ 语音播报（原生 TTS 后备） ============
            function speak(text, rate = 0.85) {
                if (!soundEnabled) return;
                speechQueue.push({ text, rate });
                if (!isSpeaking) processSpeechQueue();
            }
            function processSpeechQueue() {
                if (speechQueue.length === 0) {
                    isSpeaking = false;
                    return;
                }
                isSpeaking = true;
                const { text, rate } = speechQueue.shift();

                // 优先尝试 Web Speech API
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    // 不强制指定语言，让华为引擎自动匹配
                    u.lang = '';
                    u.rate = rate;
                    u.pitch = 1.15;
                    const voices = window.speechSynthesis.getVoices();
                    const zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh-TW'));
                    if (zhVoice) u.voice = zhVoice;

                    let timer = setTimeout(() => {
                        window.speechSynthesis.cancel();
                        fallbackNativeTTS(text, rate);
                    }, 200);

                    u.onstart = () => {
                        clearTimeout(timer);
                    };
                    u.onend = () => {
                        isSpeaking = false;
                        processSpeechQueue();
                    };
                    u.onerror = () => {
                        clearTimeout(timer);
                        fallbackNativeTTS(text, rate);
                    };
                    window.speechSynthesis.speak(u);
                } else {
                    // 浏览器不支持 Web Speech API，直接用原生 TTS
                    fallbackNativeTTS(text, rate);
                }
            }
            // 原生 TTS 后备（需要 Cordova TTS 插件）
            function fallbackNativeTTS(text, rate) {
                if (window.navigator && window.navigator.tts) {
                    window.navigator.tts.speak({
                        text: text,
                        locale: 'zh-CN',
                        rate: rate
                    }, () => {
                        isSpeaking = false;
                        processSpeechQueue();
                    }, (err) => {
                        // 原生 TTS 也失败，静默处理（可播放提示音）
                        playFallbackBeep();
                        isSpeaking = false;
                        processSpeechQueue();
                    });
                } else {
                    // 无原生 TTS 插件，播放“叮”音提示
                    playFallbackBeep();
                    isSpeaking = false;
                    processSpeechQueue();
                }
            }
            // 后备提示音（仅当所有语音方式失败时播放）
            function playFallbackBeep() {
                playTone(800, 0.15);
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
            }
            function speakItemData(itemData) {
                if (!soundEnabled) return;
                speechQueue = [];
                window.speechSynthesis?.cancel();
                isSpeaking = false;
                let textToSpeak = '';
                if (itemData.category === 'number' || itemData.number !== undefined) {
                    textToSpeak = `${itemData.cn}！`;
                    if (itemData.en) textToSpeak += ` ${itemData.en}`;
                } else if (itemData.category === 'color' || itemData.colorHex) {
                    textToSpeak = `${itemData.cn}！${itemData.en}`;
                } else if (itemData.category === 'shape' || itemData.shapeType) {
                    textToSpeak = `${itemData.cn}！${itemData.en}`;
                } else if (itemData.sound) {
                    textToSpeak = `${itemData.cn}！${itemData.sound}！${itemData.en}`;
                } else {
                    textToSpeak = `${itemData.cn}！${itemData.en}`;
                }
                speak(textToSpeak, 0.8);
            }

            // ============ 粒子效果 ============
            function spawnParticles(x, y, count = 18, colors = null) {
                const defaultColors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff922b',
                    '#e040fb', '#00bcd4', '#ff6090', '#69f0ae', '#ffab40'
                ];
                const useColors = colors || defaultColors;
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const size = Math.random() * 14 + 5;
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 100 + 40;
                    const px = Math.cos(angle) * distance;
                    const py = Math.sin(angle) * distance - Math.random() * 50;
                    particle.style.cssText = `
                        left: ${x}px;
                        top: ${y}px;
                        width: ${size}px;
                        height: ${size}px;
                        background: ${useColors[Math.floor(Math.random() * useColors.length)]};
                        --px: ${px}px;
                        --py: ${py}px;
                        animation-duration: ${Math.random() * 0.5 + 0.5}s;
                    `;
                    document.body.appendChild(particle);
                }
                setTimeout(() => {
                    document.querySelectorAll('.particle').forEach(p => {
                        if (parseFloat(p.style.animationDuration) < 1.2) p.remove();
                    });
                }, 1000);
            }
            function spawnFlyingStar(fromX, fromY, toElement) {
                const toRect = toElement.getBoundingClientRect();
                const toX = toRect.left + toRect.width / 2;
                const toY = toRect.top + toRect.height / 2;
                const tx = toX - fromX;
                const ty = toY - fromY;
                const star = document.createElement('div');
                star.className = 'flying-star';
                star.textContent = '⭐';
                star.style.cssText = `
                    left: ${fromX}px;
                    top: ${fromY}px;
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                `;
                document.body.appendChild(star);
                playStarSound();
                setTimeout(() => star.remove(), 750);
            }
            function celebrateMilestone() {
                playCelebrateSound();
                const overlay = celebrateOverlay;
                const textEl = document.createElement('div');
                textEl.className = 'celebrate-text';
                const messages = ['🎉 太棒了！', '🌟 真聪明！', '👏 好厉害！', '💖 宝宝真棒！', '🏆 超级明星！', '✨ 了不起！'];
                textEl.textContent = messages[Math.floor(Math.random() * messages.length)];
                overlay.appendChild(textEl);
                const confettiEmojis = ['🌟', '✨', '💫', '🎀', '🌸', '💖', '🎉', '🎊', '💝', '🌈', '⭐', '🦋'];
                for (let i = 0; i < 35; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti';
                        confetti.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
                        confetti.style.cssText = `
                            left: ${Math.random() * 90 + 5}%;
                            top: -30px;
                            animation-delay: ${Math.random() * 0.4}s;
                            animation-duration: ${Math.random() * 1.5 + 2}s;
                            font-size: ${Math.random() * 20 + 18}px;
                        `;
                        overlay.appendChild(confetti);
                    }, i * 25);
                }
                setTimeout(() => {
                    textEl.remove();
                    overlay.querySelectorAll('.confetti').forEach(c => c.remove());
                }, 3000);
            }

            // ============ 泡泡管理 ============
            function getBubbleSize() {
                const w = window.innerWidth;
                if (w < 400) return 75;
                if (w < 600) return 85;
                if (w < 900) return 100;
                return 115;
            }
            function getRandomPosition(bubbleSize) {
                const areaRect = bubbleArea.getBoundingClientRect();
                const margin = bubbleSize + 10;
                const maxX = areaRect.width - margin;
                const maxY = areaRect.height - margin;
                const x = Math.random() * maxX + margin / 2;
                const y = Math.random() * maxY + margin / 2;
                return { x, y };
            }
            function isTooClose(newX, newY, existingBubbles, minDist) {
                for (const b of existingBubbles) {
                    const bx = parseFloat(b.el.style.left);
                    const by = parseFloat(b.el.style.top);
                    const dist = Math.sqrt((newX - bx) ** 2 + (newY - by) ** 2);
                    if (dist < minDist) return true;
                }
                return false;
            }
            function createBubbleElement(itemData, isGolden = false) {
                const size = getBubbleSize();
                const el = document.createElement('div');
                el.className = 'bubble' + (isGolden ? ' golden' : '');
                const floatDuration = (Math.random() * 2.5 + 3) + 's';
                const floatDelay = (Math.random() * 3) + 's';
                el.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    --float-duration: ${floatDuration};
                    --float-delay: ${floatDelay};
                    --emoji-size: ${size * 0.42}px;
                `;
                const softColors = [
                    'rgba(255,182,193,0.4)', 'rgba(173,216,230,0.4)', 'rgba(152,251,152,0.4)',
                    'rgba(255,255,180,0.4)', 'rgba(221,160,221,0.4)', 'rgba(255,218,185,0.4)',
                    'rgba(200,230,255,0.4)', 'rgba(255,228,225,0.4)', 'rgba(230,255,230,0.4)',
                ];
                const chosenColor = softColors[Math.floor(Math.random() * softColors.length)];
                el.style.setProperty('--bubble-color', chosenColor);

                if (itemData.category === 'shape' || itemData.shapeType) {
                    const shapeDiv = document.createElement('div');
                    shapeDiv.className = 'bubble-shape';
                    shapeDiv.style.cssText = getShapeCSS(itemData.shapeType, size * 0.35);
                    el.appendChild(shapeDiv);
                } else if (itemData.category === 'number' || itemData.number !== undefined) {
                    const numSpan = document.createElement('span');
                    numSpan.className = 'bubble-number';
                    numSpan.textContent = itemData.number;
                    el.appendChild(numSpan);
                    if (itemData.displayEmoji && itemData.count <= 5) {
                        const miniEmoji = document.createElement('span');
                        miniEmoji.style.cssText = 'position:absolute;bottom:18%;font-size:14px;pointer-events:none;z-index:2;';
                        miniEmoji.textContent = itemData.displayEmoji.repeat(Math.min(itemData.count, 5));
                        el.appendChild(miniEmoji);
                    }
                } else if (itemData.category === 'color' || itemData.colorHex) {
                    const colorDot = document.createElement('div');
                    colorDot.style.cssText = `
                        width: ${size * 0.45}px;
                        height: ${size * 0.45}px;
                        border-radius: 50%;
                        background: ${itemData.colorHex || itemData.emoji};
                        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                        pointer-events: none;
                        z-index: 2;
                        position: relative;
                    `;
                    el.appendChild(colorDot);
                } else if (itemData.displayText) {
                    const textSpan = document.createElement('span');
                    textSpan.className = 'bubble-emoji';
                    textSpan.textContent = itemData.displayText;
                    textSpan.style.fontSize = (size * 0.5) + 'px';
                    textSpan.style.fontWeight = 'bold';
                    el.appendChild(textSpan);
                } else {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'bubble-emoji';
                    emojiSpan.textContent = itemData.emoji || '❓';
                    el.appendChild(emojiSpan);
                }

                el.addEventListener('click', (e) => {
                    if (isProcessing) return;
                    if (el.classList.contains('popping')) return;
                    handleBubbleClick(el, itemData, isGolden, e);
                });
                el.addEventListener('touchend', (e) => {
                    if (isProcessing) return;
                    if (el.classList.contains('popping')) return;
                    e.preventDefault();
                    handleBubbleClick(el, itemData, isGolden, e);
                });
                return el;
            }
            function getShapeCSS(shapeType, size) {
                const s = size + 'px';
                switch (shapeType) {
                    case 'circle': return `width:${s};height:${s};border-radius:50%;background:#ff8a80;box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'square': return `width:${s};height:${s};border-radius:6px;background:#82b1ff;box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'rectangle': return `width:${s};height:${parseInt(s)*0.6}px;border-radius:4px;background:#82b1ff;box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'triangle': return `width:0;height:0;border-left:${size*0.5}px solid transparent;border-right:${size*0.5}px solid transparent;border-bottom:${size}px solid #69f0ae;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));`;
                    case 'rightTriangle': return `width:0;height:0;border-bottom:${size}px solid #69f0ae;border-right:${size}px solid transparent;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));`;
                    case 'star': return `width:${s};height:${s};background:#ffd740;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'diamond': return `width:${s};height:${s};background:#b388ff;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'pentagon': return `width:${s};height:${s};background:#ffab40;clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'hexagon': return `width:${s};height:${s};background:#80cbc4;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'oval': return `width:${s};height:${parseInt(s)*0.7}px;border-radius:50%;background:#ff8a80;box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    case 'trapezoid': return `width:${s};height:0;border-bottom:${s} solid #82b1ff;border-left:${parseInt(s)*0.3}px solid transparent;border-right:${parseInt(s)*0.3}px solid transparent;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));`;
                    case 'parallelogram': return `width:${s};height:${parseInt(s)*0.6}px;background:#69f0ae;transform:skewX(-20deg);box-shadow:0 4px 15px rgba(0,0,0,0.12);`;
                    default: return `width:${s};height:${s};border-radius:50%;background:#ccc;`;
                }
            }
            function handleBubbleClick(el, itemData, isGolden, event) {
                isProcessing = true;
                const rect = el.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                el.classList.add('popping');
                playPopSound();
                if (isGolden) playGoldenSound();
                spawnParticles(centerX, centerY, isGolden ? 30 : 18, isGolden ? ['#ffd700', '#ffec8b', '#ffeaa7', '#fff176', '#ffcc00', '#ffab00'] : null);
                spawnFlyingStar(centerX, centerY, topBar);
                totalStars += isGolden ? 3 : 1;
                updateStarDisplay();
                speakItemData(itemData);
                if (totalStars % 10 === 0 && totalStars > 0) setTimeout(() => celebrateMilestone(), 400);
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                    const idx = bubbles.findIndex(b => b.el === el);
                    if (idx >= 0) bubbles.splice(idx, 1);
                    refillBubbles();
                    isProcessing = false;
                }, 450);
                if (isGolden) setTimeout(() => refillBubbles(), 300);
            }
            function updateStarDisplay() {
                starCountEl.textContent = totalStars;
                if (totalStars >= 100) levelIndicator.textContent = '🏆 超级学霸';
                else if (totalStars >= 50) levelIndicator.textContent = '🌟 智慧之星';
                else if (totalStars >= 30) levelIndicator.textContent = '🎈 学习达人';
                else if (totalStars >= 15) levelIndicator.textContent = '🌻 小小探索家';
                else if (totalStars >= 5) levelIndicator.textContent = '🌱 初学宝宝';
                else levelIndicator.textContent = '🌱 开始探索';
                topBar.style.transform = 'scale(1.04)';
                setTimeout(() => { topBar.style.transform = 'scale(1)'; }, 200);
            }
            function refillBubbles() {
                const currentCount = bubbles.filter(b => !b.el.classList.contains('popping')).length;
                const needed = maxBubbles - currentCount;
                for (let i = 0; i < needed; i++) spawnOneBubble();
            }
            function spawnOneBubble() {
                const dataPool = getDataForMode(currentMode);
                if (dataPool.length === 0) return;
                const itemData = dataPool[Math.floor(Math.random() * dataPool.length)];
                const isGolden = Math.random() < 0.12;
                const el = createBubbleElement(itemData, isGolden);
                const size = getBubbleSize();
                let pos;
                let attempts = 0;
                const activeBubbles = bubbles.filter(b => !b.el.classList.contains('popping'));
                do {
                    pos = getRandomPosition(size);
                    attempts++;
                } while (isTooClose(pos.x, pos.y, activeBubbles, size * 1.5) && attempts < 30);
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                bubbleArea.appendChild(el);
                bubbles.push({ el, itemData, isGolden });
            }
            function repositionAllBubbles() {
                const size = getBubbleSize();
                const activeBubbles = bubbles.filter(b => !b.el.classList.contains('popping'));
                const tempList = [];
                for (const b of activeBubbles) {
                    let pos;
                    let attempts = 0;
                    do {
                        pos = getRandomPosition(size);
                        attempts++;
                    } while (isTooClose(pos.x, pos.y, tempList, size * 1.4) && attempts < 30);
                    b.el.style.left = pos.x + 'px';
                    b.el.style.top = pos.y + 'px';
                    b.el.style.width = size + 'px';
                    b.el.style.height = size + 'px';
                    b.el.style.setProperty('--emoji-size', size * 0.42 + 'px');
                    tempList.push({ el: b.el, x: pos.x, y: pos.y });
                }
            }
            function clearAllBubbles() {
                for (const b of bubbles) {
                    if (b.el.parentNode) b.el.remove();
                }
                bubbles = [];
                speechQueue = [];
                window.speechSynthesis?.cancel();
                isSpeaking = false;
                isProcessing = false;
            }
            function initBubbles() {
                clearAllBubbles();
                for (let i = 0; i < maxBubbles; i++) {
                    spawnOneBubble();
                }
            }

            // ============ 模式切换 ============
            modeBar.addEventListener('click', (e) => {
                const btn = e.target.closest('.mode-btn');
                if (!btn) return;
                const mode = btn.dataset.mode;
                if (mode === currentMode) return;
                currentMode = mode;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                clearAllBubbles();
                initBubbles();
                const modeNames = {
                    mixed: '混合模式！探索各种知识',
                    animals: '动物朋友！来认识小动物吧',
                    fruits: '水果乐园！看看有哪些水果',
                    vegetables: '蔬菜园地！多吃蔬菜身体好',
                    numbers: '数字天地！一起来数数',
                    letters: '字母王国！认识大小写字母',
                    pinyin: '拼音小屋！学习拼音发音',
                    colors: '彩虹颜色！认识美丽的颜色',
                    shapes: '形状王国！发现有趣的形状',
                    furniture: '家具世界！认识家里的物品',
                    vehicles: '汽车总动员！看看有哪些车',
                    daily_items: '生活用品！日常物品认知',
                };
                if (soundEnabled) speak(modeNames[mode] || '切换模式', 0.9);
            });

            // ============ 声音开关 ============
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                if (soundEnabled) {
                    soundBtn.textContent = '🔊';
                    soundBtn.classList.remove('muted');
                    playTone(500, 0.1, 'sine', 0.04);
                } else {
                    soundBtn.textContent = '🔇';
                    soundBtn.classList.add('muted');
                    speechQueue = [];
                    window.speechSynthesis?.cancel();
                    isSpeaking = false;
                }
            });

            // ============ 宝宝模式 ============
            function requestFullscreen(element) {
                const el = element || document.documentElement;
                const requestMethod = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if (requestMethod) {
                    requestMethod.call(el).catch(err => console.log('全屏请求失败:', err));
                }
            }
            function exitFullscreen() {
                const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (exitMethod) {
                    exitMethod.call(document).catch(err => console.log('退出全屏失败:', err));
                }
            }

            function enterLockMode() {
                if (isLockedMode) return;
                isLockedMode = true;
                lockBtn.textContent = '🔓 退出宝宝模式';
                lockBtn.classList.add('active-mode');
                unlockBtn.classList.add('visible');
                requestFullscreen();
                if (soundEnabled) speak('宝宝模式已开启，长按右上角锁图标退出', 0.9);
            }
            function exitLockMode() {
                if (!isLockedMode) return;
                isLockedMode = false;
                lockBtn.textContent = '🔒 宝宝模式';
                lockBtn.classList.remove('active-mode');
                unlockBtn.classList.remove('visible');
                exitFullscreen();
                if (soundEnabled) speak('已退出宝宝模式', 0.9);
            }

            lockBtn.addEventListener('click', () => {
                if (isLockedMode) {
                    if (soundEnabled) speak('请长按右上角的解锁图标来退出宝宝模式', 0.9);
                } else {
                    enterLockMode();
                }
            });

            function startUnlockHold(e) {
                e.preventDefault();
                unlockBtn.classList.add('holding');
                if (unlockTimer) clearTimeout(unlockTimer);
                unlockTimer = setTimeout(() => {
                    exitLockMode();
                    unlockBtn.classList.remove('holding');
                }, 2000);
            }
            function cancelUnlockHold(e) {
                e.preventDefault();
                unlockBtn.classList.remove('holding');
                if (unlockTimer) clearTimeout(unlockTimer);
                unlockTimer = null;
            }
            unlockBtn.addEventListener('pointerdown', startUnlockHold);
            unlockBtn.addEventListener('pointerup', cancelUnlockHold);
            unlockBtn.addEventListener('pointerleave', cancelUnlockHold);
            unlockBtn.addEventListener('pointercancel', cancelUnlockHold);
            unlockBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startUnlockHold(e); });
            unlockBtn.addEventListener('touchend', cancelUnlockHold);
            unlockBtn.addEventListener('touchcancel', cancelUnlockHold);

            // ============ 初始化游戏 ============
            function init() {
                getAudioContext();
                initBubbles();
                updateStarDisplay();
                setTimeout(() => {
                    if (soundEnabled) speak('欢迎来到智慧泡泡花园！点击泡泡开始学习吧！', 0.85);
                }, 800);
                setInterval(() => {
                    const activeCount = bubbles.filter(b => !b.el.classList.contains('popping') && b.el.parentNode).length;
                    if (activeCount < maxBubbles && !isProcessing) refillBubbles();
                }, 2000);
                let lastInteraction = Date.now();
                document.addEventListener('click', () => { lastInteraction = Date.now(); });
                document.addEventListener('touchend', () => { lastInteraction = Date.now(); });
                setInterval(() => {
                    const inactiveTime = Date.now() - lastInteraction;
                    if (inactiveTime > 10000 && bubbles.length > 0 && !isProcessing) {
                        const activeBubbles = bubbles.filter(b => !b.el.classList.contains('popping') && b.el.parentNode);
                        if (activeBubbles.length > 0) {
                            const randomBubble = activeBubbles[Math.floor(Math.random() * activeBubbles.length)];
                            randomBubble.el.style.transform = 'scale(1.2)';
                            randomBubble.el.style.boxShadow = '0 0 35px rgba(255,180,40,0.7), 0 8px 32px rgba(0,0,0,0.1)';
                            setTimeout(() => {
                                randomBubble.el.style.transform = '';
                                randomBubble.el.style.boxShadow = '';
                            }, 1200);
                            lastInteraction = Date.now();
                        }
                    }
                }, 10000);
            }

            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('gesturechange', e => e.preventDefault());
            document.addEventListener('gestureend', e => e.preventDefault());

            init();
            console.log('🫧 智慧泡泡花园已就绪！');
        })();
    </script>
</body>
</html>
